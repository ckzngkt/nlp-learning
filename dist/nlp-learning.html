<script>const flow=(items)=>`<div class="flow">${items.map((x,i)=>`${i?'<span class="connector" aria-hidden="true">→</span>':''}<div class="node ${i===items.length-1?'dark':''}">${x}</div>`).join('')}</div>`;
const formula=(main,sub)=>`<div class="formula">${main}<small>${sub}</small></div>`;
const note=(text)=>`<div class="note">${text}</div>`;
const mathbox=(body,label='数式で確認する')=>`<details class="mathbox"><summary>${label}（読まなくても先に進めます）</summary>${body}</details>`;
const table=(heads,rows)=>`<div class="tablewrap"><table><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const SOURCES={slp:['Speech and Language Processing','https://web.stanford.edu/~jurafsky/slp3/'],hf:['Hugging Face · LLM Course','https://huggingface.co/learn/llm-course/chapter1/1'],tfidf:['scikit-learn · TfidfVectorizer','https://scikit-learn.org/stable/modules/generated/sklearn.feature_extraction.text.TfidfVectorizer.html'],attention:['Vaswani et al. · Attention Is All You Need','https://arxiv.org/abs/1706.03762'],rag:['Lewis et al. · Retrieval-Augmented Generation','https://arxiv.org/abs/2005.11401'],bert:['Devlin et al. · BERT','https://arxiv.org/abs/1810.04805']};
const LESSONS=[
{title:'NLPの全体像',subtitle:'タスクを入力・出力・評価で定義する',time:45,tags:['タスク','データ','ベースライン'],goal:'自然言語とは何かを説明でき、自然言語処理の問題を「入力・出力・評価」の3つで定義できる。',summary:'自然言語処理（NLP）は、人間のことばをコンピュータで扱う技術です。モデルを選ぶ前に、何を入力し、何を答えてほしいのかを決めます。',sections:[
['自然言語とは何か',`<p><b>自然言語</b>とは、日本語・英語・中国語のように、人間が日常の会話や文章で自然に使うことばです。これに対して、PythonやSQLのように、コンピュータに命令するために人間が決めたルールで作った言語を<b>人工言語</b>（形式言語）と呼びます。</p>${table(['','自然言語（日本語など）','人工言語（Pythonなど）'],[['文法','例外が多く、話し手によって揺れる','厳密に決まっている'],['意味','文脈で変わる（曖昧さがある）','1通りに決まる'],['誤り','多少間違っていても通じる','1文字違うとエラー'],['変化','新しい言葉や使い方が増え続ける','仕様変更は管理されている']])}<p>例えば「彼は眼鏡をかけた女性を見た」は、眼鏡をかけているのが彼なのか女性なのか、文だけでは決まりません。人間は状況から判断しますが、Pythonのコードにこのような曖昧さがあれば実行できません。</p>`],
['自然言語処理（NLP）とは',`<p>コンピュータが内部で扱えるのは、数値（0と1）だけです。文字も、文字コードという番号に置き換えて保存しています。ただし、番号を保存できることと、<b>意味を扱えること</b>は別です。「うれしい」と「楽しい」が近い意味であることは、文字コードの数字を見てもわかりません。</p><p><b>自然言語処理（Natural Language Processing, NLP）</b>は、この自然言語をコンピュータで扱えるようにする技術の分野です。身近な例として、次のものがあります。</p><ul><li>検索エンジンやスマートフォンの予測変換</li><li>機械翻訳、音声アシスタント、チャットボット</li><li>迷惑メールの判定、レビューの肯定・否定の分類</li><li>ChatGPTのような大規模言語モデル（LLM）</li></ul>${flow(['人間のことば（文章）','数値に変換','計算で処理','結果（分類・翻訳・回答など）'])}<p>この教材の各章は、「文章をどう数値にするか」「その数値からどう答えを出すか」を順に学ぶ構成です。</p>`],
['NLPのタスクの種類',`<p>「このレビューは肯定的？」は分類、「文章中の会社名は？」は抽出、「この質問の根拠はどの文書？」は検索です。翻訳や要約は新しい文章を出力する生成タスクです。同じ文章でも、目的によって必要な正解データが変わります。</p>${table(['タスク','入力 → 出力','評価の一例'],[['感情分類','レビュー → 肯定 / 否定','F1・混同行列'],['固有表現抽出','文章 → 人名・組織名の範囲','範囲と種類の一致によるF1'],['文書検索','質問 → 関連文書の順位','Recall@k・MRR'],['翻訳・要約','原文 → 別言語 / 短い文章','自動指標＋人による評価']])}`],
['学習の基本的な流れ',`<p>多くの教師あり学習では、文章と正解の組を集め、文章を数値にし、予測と正解のズレを小さくするようにモデルを調整します。実際に新しい文章を予測する処理が「推論」です。</p>${flow(['文章＋正解','前処理','数値表現','モデル','予測＋評価'])}<p>まず「多数派をいつも答える」だけのモデルを作ると、最低限の比較対象になります。TF-IDF＋線形分類器も有力なベースラインです。複雑なモデルが役に立つかは、同じ評価条件で比較します。</p>`],
['自然言語処理が難しい理由',`<p>「この映画、悪くない」は「悪い」という語を含んでも肯定的です。「銀行」と「川岸」を意味する英語のbankは文脈で意味が変わります。省略、皮肉、表記揺れ、専門分野の違いもあります。単語の出現回数だけを見る方法では、こうした違いを捉えにくくなります。後半の章で文脈を使う方法を学ぶのはこのためです。</p>${note('モデルの高得点だけで「ことばを完全に理解した」とは言えません。どんな入力で成功し、どんな入力で失敗したかを確かめます。')}`]
],lab:'task',exercise:['レビュー分類の入力・出力・評価指標を書いてください。','「肯定をいつも返す」モデルが、肯定80件・否定20件のデータで得るAccuracyを計算してください。'],answer:'入力はレビュー本文、出力は肯定／否定などのラベル。Accuracyは80%ですが、否定的なレビューを1件も見つけられません。クラス別のRecallも見る必要があります。',quiz:['翻訳の出力はどれ？',['文章ごとの1個の分類ラベル','別の言語の文章','関連文書の順位'],1,'タスクごとに出力の形が異なります。翻訳は文章を生成します。'],sources:['slp']},
{title:'モデルが使う数の考え方',subtitle:'ベクトル・確率・損失の役割',time:40,tags:['ベクトル','softmax','損失'],goal:'ベクトル・確率・損失がモデルの中で果たす役割を、数式を使わずに説明できる。',summary:'NLPのモデルの中では、文章を「数の並び」で表し、予測を「確率」で表し、予測のずれを「損失」で測ります。この章では、この3つの考え方を具体例で確認します。',sections:[
['ベクトル：特徴を数の並びで表す',`<p><b>ベクトル</b>は、数をいくつか並べたものです。例えば、レビューを「“面白い”の回数、“退屈”の回数、“最高”の回数」の3つの数で表すと、[2, 0, 1] のようなベクトルになります。第4章のBoWや第6章の埋め込みも、文章や単語をこのようなベクトルで表します。</p><p>モデルは、各特徴に<b>重み</b>（どれくらい重視するか）を掛けて足し合わせ、1つの<b>スコア</b>を出します。「面白い」にプラスの重み、「退屈」にマイナスの重みが付いていれば、面白いが多いレビューほどスコアが高くなります。<b>学習</b>とは、この重みをデータから決めることです。</p>${mathbox('<p>特徴 x = [2, 0, 1]、重み w = [0.5, −1, 2] のとき、対応する成分を掛けて足すと 2×0.5 + 0×(−1) + 1×2 = 3 です。この計算を<b>内積</b>と呼びます。B件の文をそれぞれd個の数で表すと、全体はB行d列の表（行列）になります。</p>')}`],
['softmax：スコアを確率に変える',`<p>モデルが出すスコアは、マイナスになったり、合計がばらばらだったりします。そのままでは「どれくらい自信があるか」を読み取りにくいので、<b>softmax</b>という変換で、すべて0以上・合計1の<b>確率</b>に直します。スコアの大小の順序は変わらず、高いスコアほど高い確率になります。</p>${table(['候補','スコア','softmax後の確率'],[['猫','2','約0.67'],['犬','1','約0.24'],['鳥','0','約0.09']])}<p><b>温度</b>は、確率の差をどれくらい強調するかを決める調整値です。温度を下げると1位の候補に確率が集中し、上げると候補同士の差が縮まって平らになります。この章の実験欄で、温度を動かして確かめられます。</p>${mathbox(formula('pᵢ = exp(zᵢ / T) / Σⱼ exp(zⱼ / T)','zᵢは各候補のスコア、Tは温度。exp（指数関数）ですべてを正の値にしてから、合計で割って1にそろえます。'))}`],
['損失：予測のずれを測る',`<p>学習では、モデルの予測がどれくらい外れているかを1つの数で表します。これを<b>損失</b>と呼びます。分類でよく使う<b>交差エントロピー</b>は、正解に付けた確率が高いほど小さく、低いほど大きくなる損失です。</p>${table(['正解に付けた確率','損失','状態'],[['0.9','小さい（約0.11）','ほぼ当たっている'],['0.5','中くらい（約0.69）','迷っている'],['0.1','大きい（約2.30）','自信を持って外している']])}<p>学習では、損失が小さくなる方向へ重みを少しずつ動かすことを繰り返します。これを<b>勾配降下法</b>と呼びます。<b>勾配</b>は「どの重みをどちらに動かせば損失が減るか」を示す情報です。霧の中の山で、足元の傾きだけを頼りに少しずつ下りていく様子にたとえられます。</p>${note('モデルの確率が0.9でも、現実で必ず90%正しいとは限りません。確率の信頼性（キャリブレーション）は別に評価します。')}${mathbox(formula('L = −log(p正解)','p正解は正解に付けた確率。logは自然対数です。0.9なら約0.105、0.5なら約0.693、0.1なら約2.303になります。'))}`]
],lab:'softmax',code:'import math\n\nz = [2.0, 1.0, 0.0]\nm = max(z)\ne = [math.exp(v - m) for v in z]\np = [v / sum(e) for v in e]\nprint(p)  # 約 [0.665, 0.245, 0.090]\nprint(-math.log(p[0]))  # 正解が先頭なら約 0.408',exercise:['レビューを「面白い」の回数と「退屈」の回数で表し、肯定的なレビューほどスコアが高くなるようにしたい場合、それぞれの重みはプラスとマイナスのどちらになりそうですか？','正解に付けた確率が0.5から0.9に上がると、損失は大きくなりますか、小さくなりますか？'],answer:'「面白い」はプラス、「退屈」はマイナスの重みになると考えられます。正解に付けた確率が上がるので、損失は小さくなります（約0.69から約0.11へ）。',quiz:['温度Tを大きくするとsoftmaxは？',['より平らになる','必ず同じ1項目が確率1になる','負の確率を返す'],0,'温度を大きくするとスコア間の差が相対的に小さくなります。'],sources:['slp']},
{title:'テキスト前処理',subtitle:'トークン化と正規化',time:50,tags:['トークナイザ','正規化','形態素解析','サブワード'],goal:'トークナイザの役割と、文字・単語・サブワードの違い、前処理の副作用を説明できる。',summary:'モデルは文章をそのまま読むのではなく、トークンの列として処理します。日本語は空白で単語が区切られないため、分割の方法を意識することが大切です。',sections:[
['トークンとトークナイザ',`<p><b>トークン</b>は、モデルが文章を処理するときの1単位です。文字1つのこともあれば、単語や、単語の一部（サブワード）のこともあります。</p><p><b>トークナイザ</b>は、文章をトークンに分け、各トークンを番号（トークンID）に変換するプログラムです。モデルが受け取るのは、文字列ではなくこの番号の列です。</p>${flow(['文章<small>猫が好き</small>','分割<small>猫 / が / 好き</small>','ID化<small>[512, 8, 1033]</small>','モデルへ入力'])}<p>どのトークンを何番にするかは、トークナイザが持つ<b>語彙</b>（トークンと番号の対応表）で決まります。生成したIDの列を文字列に戻す処理（デコード）もトークナイザが行います。上の番号は説明用の架空の値です。</p>${table(['用語','意味'],[['トークン','処理の単位（文字・単語・サブワードなど）'],['語彙','トークンとIDの対応表'],['トークンID','語彙の中でのトークンの番号'],['トークナイザ','文章 ↔ トークンIDの列を変換するプログラム']])}`],
['正規化：表記をそろえる',`<p>Unicode正規化（NFKC）は、例えば「ＡＢＣ１２３」を「ABC123」にそろえます。空白処理や英字の小文字化もよく行います。ただし、「US」と「us」の違いなど、変換で失う情報があります。原文は残しておき、どこまで正規化するかはタスクに応じて決めます。</p>${flow(['ＡＩ を学ぶ','NFKC正規化<small>AI を学ぶ</small>','トークン分割','トークンID'])}`],
['トークンの単位',`${table(['単位','特徴','注意点'],[['文字','未知語にも対応しやすい','列が長くなる'],['単語・形態素','人が解釈しやすい単位','辞書・境界の選択が必要'],['サブワード','頻出の文字列をまとめる','必ず単語の境界と一致するわけではない']])}<p>形態素解析は「私は猫が好き」を「私 / は / 猫 / が / 好き」のように分け、品詞などを付けます。サブワードのBPEは頻出する隣接ペアをまとめる手順を使います。SentencePieceはトークナイザを学習・利用するためのツール群で、BPEやUnigramなどを扱えます。</p>`],
['事前学習モデルとトークナイザの対応',`<p>モデルは文字を見ていません。受け取るのはトークンIDだけで、学習中に「512番が来たら猫の意味」のように、<b>番号と意味の対応</b>を覚えます。具体的には、IDごとに1本のベクトルを持つ表（埋め込み表）を学習します。</p>${table(['','学習時のトークナイザA','別のトークナイザB'],[['「猫」を変換したID','512','77'],['モデルが受け取る意味','猫','走る（学習時、77番は「走る」だった）']])}<p>このように、別のトークナイザを使うと「猫」が「走る」として処理されます。エラーにならないことが多く、気付きにくいのが問題です。ほかにも、区切り方が変わって学習中に見たことのない並びになる、モデルの表にない大きな番号が出てエラーになる、といったことが起きます。上の番号は説明用の架空の値です。</p><p>そのため、事前学習モデルには、学習時と同じトークナイザを使います。Hugging Faceのライブラリでは、モデルと同じ名前を指定してトークナイザを読み込むのが基本です。長い文章の切り捨て（truncation）、長さをそろえるpadding、padding位置を区別するattention maskも確認します。</p>${note('「ない」などの否定語をストップワードとして削除すると、感情分類の意味を壊すことがあります。前処理は多ければよいわけではありません。')}`]
],lab:'tokenize',code:'import unicodedata\n\ntext = "ＡＩ  を学ぶ"\nnormalized = unicodedata.normalize("NFKC", text)\nnormalized = " ".join(normalized.split())\nprint(normalized)  # AI を学ぶ\n# 日本語の単語分割は形態素解析器などを使う。\n# str.split()だけでは空白のない日本語を分割できない。',exercise:['「ＡＩ」と「AI」を検索で同じものとして扱う利点を説明してください。','「おいしくない」から「ない」を削除すると、どんな問題がありますか？'],answer:'表記揺れによる検索漏れを減らせます。ただし原表記が必要な用途では原文も保持します。否定語の削除は評価の意味を逆転させるおそれがあります。',quiz:['事前学習済みモデルのトークナイザは？',['どれでも同じIDなので自由に交換する','そのモデルに対応するものを使う','単語をすべて同じIDにする'],1,'語彙IDと埋め込みの対応がモデルの学習時と一致する必要があります。'],sources:['hf']},
{title:'BoWとTF-IDF',subtitle:'テキストを数値ベクトルにする',time:65,tags:['BoW','IDF','疎な表現'],goal:'単語頻度と文書頻度を区別し、TF-IDFを手計算できる。',summary:'この章で扱う最初の文章表現は、「どの単語が何回出たか」を数えるものです。語順の情報は失われますが、軽量で解釈しやすいベクトルが得られます。',sections:[
['Bag of Words（BoW）',`<p>語彙を［猫, 犬, 好き］とすると「猫 猫 好き」は［2, 0, 1］。「猫が犬を追う」と「犬が猫を追う」は、含まれる語とその回数が同じなので同じベクトルになり、どちらが追う側かという情報は失われます。語彙が大きいと成分の多くが0になるため、疎行列で保持します。</p>`],
['TF-IDF：珍しい語に重みを付ける',`<p><b>TF-IDF</b>は、「その文書によく出てきて、ほかの文書にはあまり出てこない語」ほど高くなる点数です。文書の特徴を表す語を見つけるために使います。</p>${table(['略語','正式名称','意味'],[['TF','Term Frequency（単語の出現頻度）','その文書の中で、語が何回出てくるか'],['DF','Document Frequency（文書頻度）','その語を含む文書がいくつあるか'],['IDF','Inverse Document Frequency（逆文書頻度）','DFが大きいほど小さくなる値。ありふれた語ほど低く、珍しい語ほど高い']])}<p>例えば、野球・経済・天気のニュース記事が1本ずつあり、野球の記事に「の」と「ホームラン」がどちらも3回出てきたとします。BoWではどちらも3ですが、「の」はどの記事にも出るので、野球の記事の特徴にはなりません。TF-IDFは、語ごとに2つの質問をして、その答えを掛け合わせます。</p>${table(['','質問','「の」','「ホームラン」'],[['TF','この文書に何回出てくる？','3回','3回'],['IDF','どれだけ珍しい？<br>（文書数 ÷ その語を含む文書の数）','3記事すべてに出る<br>→ 3 ÷ 3 ＝ 1','野球の記事だけに出る<br>→ 3 ÷ 1 ＝ 3'],['TF × IDF','','3 × 1 ＝ <b>3</b>','3 × 3 ＝ <b>9</b>']])}<p>出現回数は同じでも、珍しい「ホームラン」のほうが高い点数になります。ここでのIDFは、計算を分かりやすくした簡単な形です。実際の式は次の節で説明します。</p><p>TFとIDFの組み合わせは、次の4パターンで整理できます。</p>${table(['','ほかの文書にもよく出る','ほかの文書にはあまり出ない'],[['この文書に多く出る','中くらい（例：「の」）','<b>高い</b>（例：「ホームラン」）'],['この文書に少ししか出ない','低い','中くらい']])}`],
['TF-IDFを手で計算する',`<p>次の3文書（空白で分割済み）で、TF-IDFを順に計算します。まず簡単な形で計算し、その後で実際に使う式を確認します。</p>${table(['文書','内容'],[['文書1','猫 好き'],['文書2','犬 好き'],['文書3','猫 猫']])}<h3>手順1. TFを数える</h3><p>各文書で、それぞれの語が何回出てくるかを数えます。これはBoWと同じです。</p>${table(['','猫','犬','好き'],[['文書1','1','0','1'],['文書2','0','1','1'],['文書3','2','0','0']])}<h3>手順2. dfを数える</h3><p>その語を含む文書がいくつあるかを数えます。文書3には「猫」が2回出ていますが、数えるのは1文書です。</p>${table(['語','その語を含む文書','df'],[['猫','文書1・文書3','2'],['犬','文書2','1'],['好き','文書1・文書2','2']])}<h3>手順3. IDFを計算する（簡単な形）</h3><p>IDF ＝ 文書数 ÷ df です。文書数は3です。</p>${table(['語','計算','IDF'],[['猫','3 ÷ 2','1.5'],['犬','3 ÷ 1','3'],['好き','3 ÷ 2','1.5']])}<p>3文書のうち1つにしか出ない「犬」は、2つに出る「猫」「好き」より珍しいので、IDFが2倍になります。</p><h3>手順4. TF × IDF を計算する</h3><p>手順1の表の各マスに、その語のIDFを掛けます。</p>${table(['','猫','犬','好き'],[['文書1','1 × 1.5 ＝ 1.5','0','1 × 1.5 ＝ 1.5'],['文書2','0','1 × 3 ＝ <b>3</b>','1 × 1.5 ＝ 1.5'],['文書3','2 × 1.5 ＝ 3','0','0']])}<p>文書2では、珍しい「犬」が「好き」の2倍の点数になりました。文書3の「猫」は2回出ているので、TFの分だけ高くなります。TFが0の語は、IDFに関係なく0です。ここまでがTF-IDFの基本的な考え方です。</p><p>実際のツールでは、この簡単な形に少し調整を加えた式を使います。この章の実験欄とコード例の値（1.288、1.693など）はその式によるもので、簡単な形とは数値が違いますが、「珍しい語ほど高い」という順序は同じです。</p>${mathbox(`<p>実際には、手順3の「文書数 ÷ df」に2つの調整を加えます。</p><p><b>調整1：ln（自然対数）で値を縮める。</b>割り算だけだと、文書数が多いときに珍しい語のIDFが極端に大きくなります。lnを取ると、大小の順序はそのままで差が縮まります。lnはPythonでは<code>math.log</code>で計算できます。</p>${table(['文書数10,000のとき','文書数 ÷ df','ln を取った値'],[['1文書にだけ出る語','10,000','約9.2'],['100文書に出る語','100','約4.6'],['すべての文書に出る語','1','0']])}<p><b>調整2：+1を足す。</b>文書数とdfにそれぞれ1を足すのは、極端な値を避けるための調整です。最後に1を足すのは、すべての文書に出る語のIDFが0にならないようにするためです。</p>${formula('idf ＝ ln((文書数 + 1) / (df + 1)) + 1','この教材の実験欄とコード例は、この式（scikit-learnの標準設定）で計算しています。')}<p>先ほどの3文書で計算すると、次のようになります。</p>${table(['語','① (3+1) ÷ (df+1)','② ln(①)','③ ② + 1 ＝ IDF'],[['猫','4 ÷ 3 ≈ 1.333','≈ 0.288','≈ 1.288'],['犬','4 ÷ 2 ＝ 2','≈ 0.693','≈ 1.693'],['好き','4 ÷ 3 ≈ 1.333','≈ 0.288','≈ 1.288']])}<p>数値は簡単な形と変わりましたが、「犬」が「猫」「好き」より高いという順序は同じです。TF-IDFは、手順4と同じようにTFにこのIDFを掛けます。例えば文書3の「猫」は 2 × 1.288 ≈ 2.575 です。実験欄の初期値はこの3文書なので、表示される値と比べてみてください。</p>`,'実際に使う式（scikit-learnの場合）')}<p>scikit-learnの標準設定では、この後さらに、各文書ベクトルの長さを1にそろえる処理（L2正規化）を行います。この章の実験欄とコード例では、手計算と比べやすいようにL2正規化をしていません。</p>`],
['語彙とIDFは訓練データだけで作る',`<p>語彙やIDFは訓練データでfitし、検証・テストデータにはtransformだけを使います。テスト文書を含めてIDFを計算すると、評価用の情報が学習に入り込むデータ漏洩になります。日本語では分かち書き済みテキストや文字n-gramを使う選択肢があります。</p>`]
],lab:'tfidf',code:'from sklearn.feature_extraction.text import TfidfVectorizer\n\n# 教材用に空白で分割済み。実際の日本語には適切な分割を使う。\ndocs = ["猫 好き", "犬 好き", "猫 猫"]\nv = TfidfVectorizer(tokenizer=str.split, token_pattern=None,\n                    lowercase=False, norm=None)\nx = v.fit_transform(docs)\nprint(v.get_feature_names_out())\nprint(x.toarray())\n# 新しい文章には v.transform(["犬 猫"]) を使う。',exercise:['4文書［猫 好き］［犬 好き］［猫 猫］［鳥 好き］で、「好き」と「鳥」のdfと、簡単な形（文書数 ÷ df）のIDFを求めてください。','語順が大切なタスクでBoWが困る例を1つ考えてください。'],answer:'「好き」は3文書に出るのでdf＝3、IDF＝4 ÷ 3 ≈ 1.33。「鳥」は1文書だけなのでdf＝1、IDF＝4 ÷ 1 ＝ 4。ほとんどの文書に出る「好き」は低く、珍しい「鳥」は高くなります。語順の例としては、主語と目的語の入れ替えや否定の範囲などが、語の数だけでは区別しにくいです。',quiz:['1文書で「猫」が10回出たとき、その文書のdfへの寄与は？',['10','1','0.1'],1,'文書頻度は出現回数ではなく、その語を含む文書の数です。'],sources:['tfidf']},
{title:'分類と評価',subtitle:'Accuracy以外の評価指標',time:60,tags:['分類','Precision / Recall','データ分割'],goal:'分類器の基本と、Accuracy・Precision・Recall・F1の使い分けを理解する。',summary:'分類モデルの作成は、NLPの最初の実験に向いています。学習のコードと同じくらい、未知のデータでの性能を正しく測ることが重要です。',sections:[
['ロジスティック回帰によるベースライン',`<p><b>ロジスティック回帰</b>は、第2章の「特徴×重みでスコアを出す」方法に、スコアを0〜1の確率に変える処理を組み合わせた分類器です。「このレビューが肯定的である確率は0.8」のように出力し、通常は0.5以上なら肯定と判定します。この境目を<b>しきい値</b>と呼びます。しきい値を変えると、見逃しと誤判定のバランスも変わります。</p><p>TF-IDFと組み合わせると、「最高」「面白い」には肯定方向、「退屈」「最悪」には否定方向の重みが学習されます。どの語がどちらに効いているかを確認できるので、最初に試すベースラインに向いています。</p>${flow(['文書','TF-IDF','スコア','確率','ラベル'])}${mathbox(formula('z = w・x + b<br>p = sigmoid(z) = 1 / (1 + exp(−z))','xは特徴、wは重み、bはバイアス。sigmoidは、どんなスコアも0〜1の値に変換する関数です。'))}`],
['混同行列と評価指標',`<p>迷惑メールの判定を例にします。迷惑メールを「陽性」とすると、予測と実際の組み合わせは次の4通りです。この表を<b>混同行列</b>と呼びます。</p>${table(['','実際に迷惑メール','実際は普通のメール'],[['迷惑メールと予測','TP：正しく見つけた','FP：普通のメールを誤って判定'],['普通のメールと予測','FN：見逃した','TN：正しく通した']])}<p>評価指標は、この4つのどこに注目するかで違います。</p>${table(['指標','答える問い','重視する場面'],[['Accuracy（正解率）','全体のうち何割当たったか','クラスの数が同じくらいのとき'],['Precision（適合率）','「迷惑メール」と判定したもののうち、本当に迷惑メールだった割合','大事なメールを誤って消したくないとき'],['Recall（再現率）','本当の迷惑メールのうち、見つけられた割合','見逃しを減らしたいとき'],['F1','PrecisionとRecallのバランス','両方を1つの数で比べたいとき']])}<p>Accuracyは、多数派のクラスが多いデータでは当てになりません。例えばメールの99%が普通のメールなら、「すべて普通」と答えるだけでAccuracyは99%ですが、迷惑メールを1件も見つけられません。クラスが3つ以上ある場合は、クラスごとのスコアや、各クラスのF1を平均したmacro F1も確認します。</p>${mathbox(formula('Accuracy = (TP + TN) / 全件<br>Precision = TP / (TP + FP)<br>Recall = TP / (TP + FN)<br>F1 = 2 × Precision × Recall / (Precision + Recall)','F1はPrecisionとRecallの調和平均で、どちらかが低いとF1も低くなります。'))}`],
['データの分割方法',`<p>訓練用はパラメータの学習、検証用は設定の選択、テスト用は最後の評価に使います。同じ著者・同じ記事の複製が両側に入る場合は、グループ単位の分割を検討します。未来を予測する用途では時系列で分割します。</p>${note('同じテストデータで何度も設定を選ぶと、テストへの過適合が起きます。ベクトル化を含む処理はPipelineでまとめ、訓練側だけでfitします。')}`]
],lab:'metrics',code:'from sklearn.pipeline import make_pipeline\nfrom sklearn.feature_extraction.text import TfidfVectorizer\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics import classification_report\n\n# 小さすぎるデータなので、手順の確認用。性能を主張しない。\ntrain_x = ["映画 面白い", "作品 最高", "映画 退屈", "作品 最悪"]\ntrain_y = [1, 1, 0, 0]\ntest_x = ["映画 最高", "作品 退屈"]\ntest_y = [1, 0]\nmodel = make_pipeline(\n    TfidfVectorizer(tokenizer=str.split, token_pattern=None),\n    LogisticRegression(random_state=0))\nmodel.fit(train_x, train_y)\nprint(classification_report(test_y, model.predict(test_x),\n                            zero_division=0))',exercise:['迷惑メールの見逃しを減らしたい場合、どの指標を優先しますか？','モデルが「迷惑メール」と判定した10件のうち、8件が本当に迷惑メールでした。本当の迷惑メールは全部で12件あります。PrecisionとRecallはそれぞれいくつですか？'],answer:'迷惑メールを陽性とするとRecallを重視します。ただし普通のメールを誤って除外する害も考えて調整します。Precisionは判定した10件中8件で0.8、Recallは本当の迷惑メール12件中8件で約0.67です。',quiz:['テストデータを使って何度も設定を選ぶと？',['評価がより公平になる','テストに合わせた選択で評価が楽観的になる','データが自動的に増える'],1,'設定選択は検証データで行い、テストは最後の確認に使います。'],sources:['slp','tfidf']},
{title:'単語・文の埋め込み',subtitle:'単語・文のベクトルと類似度',time:50,tags:['分布仮説','埋め込み','コサイン類似度'],goal:'疎な表現と密な表現、静的埋め込みと文脈依存の表現を区別できる。',summary:'埋め込みは、単語や文を比較的少数の数値に写す表現です。似た文脈で現れる語が、近い表現を持つように学習する考え方から始めます。',sections:[
['埋め込みとは（数式なしの説明）',`<h3>1. BoWでは「意味の近さ」が分からない</h3><p>BoWやTF-IDFでは、「猫」と「犬」は別々の列にすぎません。トークンIDも同じで、512番と513番が近くても意味が近いわけではありません。そのため、コンピュータには「猫と犬は似ている」「猫と株価は関係ない」ということが分かりません。</p><h3>2. 埋め込みは「意味の地図」上の位置</h3><p><b>埋め込み</b>は、単語を地図の上の位置（座標）で表す方法です。地図で東京と横浜が近く、東京と札幌が遠いように、埋め込みでは「猫」と「犬」が近く、「猫」と「株価」が遠い位置に置かれます。本物の地図は縦・横の2方向ですが、埋め込みは数百の方向を持つ地図です。それでも「近い位置にあれば意味が近い」という考え方は同じです。</p><h3>3. 位置は、文章から自動で学習する</h3><p>位置は人が1語ずつ決めるのではなく、大量の文章から自動で学習します。手掛かりは「似た使われ方をする語は、意味も似ている」という考え方（分布仮説）です。</p>${table(['文脈','入る語の例'],[['＿＿を飼っている','猫、犬'],['＿＿にえさをあげる','猫、犬'],['＿＿がかわいい','猫、犬']])}<p>同じような文脈に出てくる語は、地図上で近くに置かれます。人間も、知らない語「ポメラニアン」を「ポメラニアンを散歩させた」という文で見れば、犬の仲間だろうと推測できます。それを大量の文章で行うのが埋め込みの学習です。</p><h3>4. 近さは数値で測る</h3><p>2つの語の近さは、<b>コサイン類似度</b>という数値で測ります。1に近いほど似ていて、0付近なら関係が薄いことを表します。計算方法は後の節で扱いますが、まずはこの読み方だけで十分です。</p><h3>5. 同じ語でも、文によって意味が変わる</h3><p>「かける」には、電話をかける、眼鏡をかける、橋をかける、など複数の意味があります。</p>${table(['方法','「かける」の扱い'],[['Word2Vecなど（静的な埋め込み）','地図上の1か所にしか置けない。複数の意味が混ざった位置になる'],['BERTなど（文脈に応じた埋め込み）','周りの語を見て、文ごとに位置を変える。「電話をかける」と「眼鏡をかける」は別の位置になる']])}<h3>6. 文全体も、1つの位置で表せる</h3><p>単語だけでなく、文全体を1つの位置で表すこともできます。「駅までの行き方を教えて」と「駅へはどう行けばいい？」は共通する語が少ないので、BoWでは似ていると判定しにくい文です。文の埋め込みでは、意味が近いので近い位置になります。この性質は、第11章の検索（RAG）で、質問に近い文書を探すのに使います。</p>${table(['','BoW・TF-IDF','埋め込み'],[['表すもの','どの語が何回出たか','意味の地図上の位置'],['「猫」と「犬」','無関係な別の列','近い位置'],['言い換えた文同士','共通の語が少ないと似ていないと判定','意味が近ければ近い位置'],['作り方','数えるだけ（学習不要）','大量の文章から学習する']])}<h3>7. Transformerと文の埋め込みの関係</h3><p>Transformerが出力するのは、<b>トークンごとに1本ずつ</b>のベクトルです。「猫が好き」を入力すると、「猫」「が」「好き」それぞれのベクトルが出てきます。どれも周りの語を見て作られますが、この時点では文全体を表す1本のベクトルはありません。文のベクトルにするには、まとめる工程が必要です。</p>${flow(['文<small>猫が好き</small>','Transformer','トークンごとのベクトル<small>猫・が・好き の3本</small>','まとめる<small>平均など</small>','文のベクトル<small>1本</small>'])}${table(['まとめ方','内容'],[['平均する（pooling）','全トークンのベクトルを平均して1本にする'],['代表のトークンを使う','BERTは文頭に特別なトークン［CLS］を置き、その位置のベクトルを文の代表として使う']])}<p>ただし、普通のBERTの出力をそのまままとめても、「意味が近い文ほど近くなる」とは限りません。文同士を比べるための学習をしていないためです。そこで、似た意味の文が近い位置に来るように追加学習した<b>文埋め込みモデル</b>（Sentence-BERTなど）を使います。中身はTransformerで、まとめる工程まで含めて学習しています。第11章の検索で使うのはこのモデルです。</p>${table(['モデル','トークンごとのベクトルの使い道'],[['BERTなど（Encoder-only）','分類・抽出。まとめれば文のベクトルにもできる'],['文埋め込みモデル','文を1本のベクトルにして、検索や類似度の計算に使う'],['GPTなど（Decoder-only）','次のトークンの予測（文章の生成）。文のベクトル化が主な目的ではない']])}<p>つまり、Transformerは文のベクトル化に<b>使える部品</b>であり、それ自体が文を1本のベクトルにするわけではありません。</p>${note('近い位置にある語が、同じ意味とは限りません。「暑い」と「寒い」は反対の意味ですが、「今日は＿＿ですね」のように同じ文脈で使われるので、近い位置に置かれやすくなります。')}`],
['Word2Vec：埋め込みを学習する代表的な方法',`<p><b>Word2Vec</b>は、2013年に発表された、単語の埋め込みを学習する代表的な方法です。例えばSkip-gramという方式では、文章中の各単語から「その周りに出てくる単語」を当てる練習を、大量の文章で繰り返します。うまく当てられるように各単語の位置を調整していくと、似た文脈に出てくる単語が近くに集まります。単語の位置（ベクトル）は、この練習の副産物として得られます。</p><p>学習が終わると、語彙のすべての単語に1つずつ位置が決まった表（埋め込み表）ができます。ただし、地図の各方向が「動物らしさ」のような分かりやすい意味を持つとは限りません。意味を持つのは、主に単語同士の<b>近さ</b>です。</p>${mathbox('<p>one-hot表現（語彙の中でその語の位置だけを1、残りを0にする表現）では、「猫」と「犬」の内積は0になり、どの2語も同じだけ離れています。このような関係を直交と呼びます。埋め込みは、語彙V個の各語にd個の数を割り当てるので、埋め込み表の大きさはV×dです。</p>')}`],
['コサイン類似度：向きで近さを測る',`<p>埋め込みのベクトルは、地図上の原点から伸びる矢印と考えられます。2つのベクトルの近さは、矢印の<b>向き</b>がどれくらいそろっているかで測ります。これが<b>コサイン類似度</b>です。</p>${table(['2本の矢印の向き','コサイン類似度','目安'],[['同じ向き','1','とても似ている'],['直角','0','関係が薄い'],['正反対','−1','向きが逆']])}<p>矢印の長さは無視して向きだけを比べるので、長い文と短い文のように大きさが違うベクトルも比べやすくなります。この章の実験欄で、角度を変えながら値の変化を確かめられます。ただし、似ていると判定されても、否定（「好き」と「好きではない」）や数値の違いを区別できない場合があります。</p>${mathbox(formula('cos(a, b) = (a・b) / (||a|| ||b||)','内積を2つのベクトルの長さで割った値です。ゼロベクトルでは定義できません。'))}`],
['文脈に応じた表現と文の埋め込み',`<p>静的埋め込みでは、bankはどの文でも同じベクトルです。Transformerなどは周囲の文脈で表現を変えます。文の埋め込みには、複数の単語ベクトルを1本にまとめるpooling（プーリング）も使えます。例えば各成分の平均を取ります。ただし、検索用途では、文同士の類似度を学習した文埋め込みモデルが適することがあります。</p>${note('2次元の散布図は説明用の投影です。高次元の距離をすべて保てるわけではなく、見た目だけでモデルの品質を判断しません。')}`]
],lab:'embedding',code:'import math\n\na, b = [1, 2], [2, 1]\ndot = sum(x*y for x, y in zip(a, b))\nnorm = lambda v: math.sqrt(sum(x*x for x in v))\nprint(dot / (norm(a)*norm(b)))  # 0.8',exercise:['「猫」と「犬」の埋め込みが近い位置になるのはなぜですか？分布仮説を使って説明してください。','「川のbank」と「金融のbank」を静的埋め込みで区別できない理由は？'],answer:'猫と犬は「＿＿を飼っている」「＿＿にえさをあげる」のように似た文脈で使われるため、学習の結果、近い位置に置かれます。静的埋め込みは、同じ語（同じID）に常に同じベクトルを割り当て、周囲の文脈を使わないためです。',quiz:['文脈依存の埋め込みとは？',['同じ語でも周囲の文章で表現が変わる','語の文字数だけを返す','同じ単語なら、文脈によらず同じベクトルを使う'],0,'周囲の情報を混ぜて、各位置の表現を作ります。'],sources:['slp','hf']},
{title:'系列モデルと言語モデル',subtitle:'系列の扱いと次単語予測',time:55,tags:['n-gram','RNN','Perplexity'],goal:'言語モデルの目的と、n-gram・RNNの違いを説明できる。',summary:'文章には順序があります。言語モデルは「それまでのことばを見て、次のトークンの確率を出す」モデルです。生成は、この予測を繰り返します。',sections:[
['言語モデルとn-gram',`<p><b>言語モデル</b>は、「ここまでの語を見て、次にどの語が来やすいか」を確率で答えるモデルです。例えば「今日は天気が」の次なら、「良い」は高く、「猫」は低い確率になります。文章全体の自然さも、この「次の語の確率」を1語ずつ積み重ねて評価します。</p><p>最も単純な<b>bigramモデル</b>は、直前の1語だけを見て次を予測します。学習データで「猫」の後に「が」が3回、「は」が1回出ていたら、「猫」の次が「が」である確率は4回中3回で0.75です。この方法には、学習データにない組み合わせの確率が0になる、直前の1語より前の文脈を使えない、という弱点があります。</p>${mathbox(formula('P(w₁, …, wₙ) = Πₜ P(wₜ | w₁, …, wₜ₋₁)','文章全体の確率は、各位置の「次の語の確率」の積です（確率の連鎖律）。実装では小さな値の積の代わりに対数の和を扱います。未観測の組の確率を0にしない工夫を平滑化と呼びます。'))}`],
['RNN：読みながらメモを更新する',`<p><b>RNN</b>は、文章を先頭から1語ずつ読み、そのたびに「ここまでの内容のメモ」（状態ベクトル）を書き換えていくモデルです。新しい語を読むと、前のメモと今の語を組み合わせて新しいメモを作ります。bigramと違い、メモを通じて前の方の語の情報も持ち越せます。</p>${flow(['前のメモ＋今の語','組み合わせて変換','新しいメモ','次の語へ'])}<p>ただし、メモの大きさは決まっているので、長い文章では前の方の情報が薄れていきます。学習の面でも、遠く離れた語同士の関係（長期依存）を学びにくいことが知られています。<b>LSTM</b>や<b>GRU</b>は、「何を残し、何を忘れるか」を調節する仕組み（ゲート）を加えて、これを改善したモデルです。それでも1語ずつ順番に処理するため、並列に計算しにくいという制約が残ります。これを解決したのが、第8〜9章のAttentionとTransformerです。</p>${mathbox(`${flow(['現在の入力 xₜ<br>前の状態 hₜ₋₁','それぞれ重み行列で変換','足し合わせて<br>バイアスを加える','活性化関数 tanh','新しい状態 hₜ'])}${formula('hₜ = tanh(Wₓ xₜ + Wₕ hₜ₋₁ + b)','列ベクトルで表記。Wₓ・Wₕは学習する重み、bはバイアスです。')}<p>入力と状態をそのまま足すのではなく、それぞれ変換してから足します。入力が3次元・状態が2次元なら、Wₓは2×3、Wₕは2×2です。tanh（双曲線正接）は各成分を−1から1の範囲に変換する活性化関数です。この更新をトークンごとに繰り返します。</p><p>長い系列では、更新に使う勾配が極端に小さくなる「勾配消失」や、大きくなる「勾配爆発」が起こりやすくなります。そのため、遠く離れた語同士の関係（長期依存）を学びにくくなることがあります。LSTMやGRUは、情報をどの程度残すかを調整するゲートで長期依存の学習を助けますが、系列方向に順次計算する制約があります。</p>`)}`],
['言語モデルの評価',`<p>言語モデルの性能は、<b>Perplexity</b>（パープレキシティ）で測ることが多いです。直感的には「次の語を予測するとき、平均して何択で迷っているか」を表す値で、低いほど予測が上手です。例えばPerplexityが10なら、毎回10個の候補で迷っている程度の予測力ということです。</p><p>ただし、トークナイザが違うモデル同士では予測する単位が違うので、単純に比較できません。また、Perplexityが低くても、事実の正しさや回答の役立ち方は保証されません。</p>${mathbox(formula('Perplexity = exp(平均の負の対数尤度)','正解のトークンに付けた確率の対数を平均し、符号を反転してexpを取ります。正解に高い確率を付けるほど低くなります。'))}`]
],lab:'bigram',exercise:['「猫 が」「猫 が」「猫 は」のカウントからP(が|猫)を求めてください。','bigramが扱えない長い文脈の例を考えてください。'],answer:'平滑化なしなら2/3。例えば文章のかなり前に出た登場人物に合わせて代名詞を選ぶことなどは、直前の語だけでは難しいです。',quiz:['異なるトークナイザのPerplexityは？',['そのまま比較すれば必ず公平','評価単位が異なるため単純比較できない','どのモデルでも同じ値'],1,'分割が変わると予測する単位と系列長が変わります。'],sources:['slp']},
{title:'Attention',subtitle:'文脈ごとの重み付け',time:60,tags:['Query / Key / Value','softmax','加重平均'],goal:'Q・K・Vの役割と、Attentionの行列サイズ・計算結果を説明できる。',summary:'Attentionは「どの位置から、どれくらい情報を取り込むか」を決める計算です。各位置の情報を、関係の強さに応じた重みで混ぜ合わせます。',sections:[
['Query・Key・Valueの役割',`<p><b>Attention</b>は、各トークンが「文中のどの語の情報を、どれくらい取り込むか」を決めて、その割合で情報を混ぜる仕組みです。図書館で調べものをする場面にたとえると、3つの役割が分かりやすくなります。</p>${table(['役割','たとえ','Attentionでの意味'],[['Query（クエリ）','調べたいこと','今のトークンが探している情報'],['Key（キー）','本の見出し','各トークンが「自分はこういう情報です」と示す目印'],['Value（バリュー）','本の中身','実際に取り込まれる情報']])}<p>QueryとKeyを照らし合わせて、関係が強いトークンほど大きな割合（重み）を付けます。重みは合計1になるように調整され（第2章のsoftmax）、その割合でValueを混ぜたものが、そのトークンの新しいベクトルになります。例えば「彼女はケーキを買って、それを食べた」の「それ」は、「ケーキ」に大きな重みを付けることで、ケーキの情報を取り込めます。</p>${flow(['QueryとKeyを照合','関係の強さ','重み（合計1）','重みでValueを混ぜる','新しいベクトル'])}`],
['Self-AttentionとCross-Attention',`<p><b>Self-Attention</b>は、1つの文の中で、各トークンが同じ文のほかのトークンを参照する使い方です。上の「それ」と「ケーキ」の例はこれにあたります。<b>Cross-Attention</b>は、翻訳で訳文側のトークンが原文側のトークンを参照するように、2つの異なる系列の間で参照する使い方です。</p>${mathbox(`${formula('Attention(Q, K, V) = softmax(QKᵀ / √dₖ) V','Q: n×dₖ、K: m×dₖ、V: m×dᵥ → 重み: n×m → 出力: n×dᵥ')}<p>softmaxは、各Queryの行ごとにKey方向へ適用します。√dₖで割るのは内積のスケールを調整するためです。Self-AttentionではQ・K・Vは同じ系列に由来します。Cross-AttentionではQuery側とKey・Value側の系列が異なります。</p>`)}`],
['causal maskとpadding mask',`<p>自己回帰型の次トークン予測では、未来の正解トークンを見せてはいけません。そこで、未来の位置への重みが0になるように隠す<b>causal mask</b>を使います。<b>padding mask</b>は、文の長さをそろえるために足した空の位置を、参照から外すためのものです。</p>${note('Attentionの重みが大きいことは、必ずしも人間向けの「理由」や因果的重要性を表しません。ここでのデモは架空のスコアによる計算の可視化です。')}`]
],lab:'attention',code:'import numpy as np\n\nq = np.array([[1., 0.]])\nk = np.array([[1., 0.], [0., 1.], [1., 1.]])\nv = np.array([[1., 0.], [0., 2.], [2., 2.]])\nscores = q @ k.T / np.sqrt(k.shape[1])\ne = np.exp(scores - scores.max(axis=-1, keepdims=True))\nweights = e / e.sum(axis=-1, keepdims=True)\nprint(weights)\nprint(weights @ v)  # 1個のQueryに対する2次元の出力',exercise:['「彼女はケーキを買って、それを食べた」で、「それ」が最も大きな重みを付けそうな語はどれですか？理由も答えてください。','2つの語の重みが0.25と0.75のとき、混ぜた結果はどちらの語の情報に近くなりますか？'],answer:'「ケーキ」です。「それ」が指している対象の情報を取り込む必要があるためです。混ぜた結果は、重みの大きい0.75の語の情報に近くなります。',quiz:['Attentionの重みを掛けて混ぜる対象は？',['Query','Value','トークンの文字数'],1,'QueryとKeyで重みを作り、その重みでValueを混ぜます。'],sources:['attention']},
{title:'Transformer',subtitle:'Attentionを積み重ねた構造',time:60,tags:['Multi-head','位置情報','Encoder / Decoder'],goal:'Transformerの主要な構成要素と、3つの利用形態を説明できる。',summary:'Attentionだけでは語順を区別できません。Transformerは、位置情報、複数のAttention（Multi-head）、各位置に適用するFFNを組み合わせた層を積み重ねた構造です。',sections:[
['Transformerブロックの構成',`${flow(['埋め込み＋位置情報','Multi-head Attention','残差＋正規化','FFN','残差＋正規化'])}<p>Multi-head Attentionは、異なる重み行列を使ったAttentionを複数並行して計算し、結果をつなげてから再び線形変換します。FFN（Feed-Forward Network、順伝播型ネットワーク）は線形変換と活性化関数を組み合わせた処理で、同じFFNを各トークンの位置に別々に適用します。残差接続は層の入力を出力に足す仕組みで、値の大きさをそろえる層正規化（Layer Normalization）とともに、深いネットワークの学習を安定させます。この図は元のTransformerの配置を簡略化したもので、正規化を置く位置は方式によって異なります。</p>`],
['位置情報',`<p>位置情報のないSelf-Attentionは、入力の並べ替えに対して出力も同じように並び替わる性質があります。語順を区別するには位置の情報が必要です。元のTransformerは正弦・余弦の位置符号化を使います。学習可能な位置埋め込みや回転位置埋め込み（RoPE）などもあります。</p><p>通常のAttentionのスコア行列は、系列長nに対してn×nの大きさになります。そのため、文章が長くなると計算量とメモリ使用量が系列長の2乗に比例して増えます。この負担を減らす派生方式も提案されています。</p>`],
['3つの利用形態',`${table(['形態','典型的な参照範囲','利用例'],[['Encoder-only','全入力位置を参照','BERT系：分類・抽出'],['Decoder-only','自分と過去の位置を参照','GPT系：次トークン生成'],['Encoder-decoder','入力を符号化し、出力側がCross-Attentionで参照','翻訳・要約']])}<p>学習時はcausal maskを使って複数位置の次トークン予測を並列に計算できます。一方、通常の自己回帰生成は、新しく決まったトークンを入力に足しながら順に進みます。</p>`]
],lab:'mask',exercise:['5トークンのcausal maskで、3番目の位置が参照できる位置を挙げてください。','位置情報が必要な理由を、「犬が猫を追う」を例に説明してください。'],answer:'1・2・3番目を参照できます。語の集合だけでなく並び方が役割を変えるので、位置情報で順序を伝えます。',quiz:['学習時に次トークン予測を並列に計算するには？',['未来の正解を自由に見せる','causal maskで未来を隠す','語順をすべて削除する'],1,'各位置の予測に未来の正解が漏れないようにします。'],sources:['attention','hf']},
{title:'事前学習とLLM',subtitle:'事前学習から指示追従まで',time:65,tags:['自己教師あり','BERT','SFT','生成'],goal:'事前学習・追加学習・推論を区別し、生成設定の役割を説明できる。',summary:'大規模言語モデル（LLM）は大量の文章から言語の規則性を学びます。チャットで指示に従う振る舞いは、事前学習だけで決まるわけではありません。',sections:[
['自己教師ありの事前学習',`<p>自己回帰型の事前学習は、文章を1トークンずらして次トークンを正解にします。マスク言語モデルは、隠した部分を周囲から予測します。人がすべての文章にラベルを付けなくても、文章自体から訓練用の正解を作れるので自己教師あり学習と呼びます。</p>${flow(['大量の文章','事前学習','指示と応答でSFT','選好に基づく調整など','推論'])}<p>SFTはよい指示・応答の例で追加学習する方法です。人や別モデルによる選好を使う調整もあります。この流れは代表例であり、すべてのモデルが同じ工程を持つわけではありません。</p>`],
['BERTとGPT：2つの代表的な事前学習モデル',`<p><b>BERT</b>（Bidirectional Encoder Representations from Transformers）は、2018年にGoogleが発表した、文章を<b>理解する</b>ことに特化したTransformerのモデルです。文章を入力すると、周りの文脈を反映したトークンごとのベクトルを出力します。文章を生成するのではなく、文章の意味をベクトルとして読み取る役割です（Encoder-only）。</p><h3>BERTの事前学習：穴埋め問題</h3><p>大量の文章の一部の語（約15%）を隠し、それを当てる練習を繰り返します。</p>${table(['入力','当てる語'],[['今日は［MASK］が降ったので、傘をさした','雨']])}<p>「雨」を当てるには、前の「今日は」と後ろの「降ったので、傘をさした」の両方が手掛かりになります。前後の両方を見ることが、名前のBidirectional（双方向）の意味です。正解は元の文章そのものなので、人がラベルを付ける必要はありません。</p><h3>BERTの使い方：ファインチューニング</h3><p>事前学習したBERTの上に小さな出力層を付け、少量のラベル付きデータで追加学習します。例えば、レビュー数千件と肯定・否定のラベルがあれば感情分類器を作れます。穴埋め練習で身に付けたことばの知識を土台にできるので、ゼロから学習するより少ないデータで高い性能が出やすくなります。</p><h3>GPTとの違い</h3>${table(['','BERT','GPT'],[['Transformerの形','Encoder-only','Decoder-only'],['見る範囲','前後の両方','前だけ'],['事前学習','穴埋め（隠した語を当てる）','次の語を予測する'],['得意なこと','理解（分類・抽出・検索）','生成（文章作成・対話）']])}<p>現在、文章の生成ではGPTのようなLLMが主流です。一方、BERT系のモデルは軽量で速いため、分類や検索（文埋め込み）では今も広く使われています。日本語の文章で事前学習したBERTもあります。</p>`],
['テキスト生成の仕組み',`<p>greedyは最大確率のトークンを選びます。サンプリングは分布に従って抽選します。温度（temperature）は分布の鋭さ、top-kは候補数、top-pは累積確率を使って候補を絞ります。選んだトークンを文脈に足して次を予測し、終了トークンや長さ制限で止めます。</p>${note('温度を0に近づけても、事実の正しさは保証されません。モデルはもっともらしい文章を生成できても、正しい根拠を持つとは限りません。')}`],
['プロンプトと追加学習の違い',`<p>プロンプトで例や制約を渡すのは推論時の条件付けで、通常はモデルの重みを更新しません。ファインチューニング（fine-tuning）は訓練によって重みを変更します。専門知識の更新には検索を組み合わせる方法、出力形式や振る舞いの適応には追加学習など、目的に合わせて比較します。</p><p>評価は代表的な質問と正解基準を先に決めて行います。文章の流暢さ、指示への適合、事実性、コスト・速度は別々の軸です。</p>`]
],lab:'sampling',exercise:['「プロンプトに例を3つ入れる」と「モデルを追加学習する」の違いを説明してください。','数値を含む回答の事実性をどう検証するか考えてください。'],answer:'前者は入力の追加、後者は学習によるパラメータ更新です。数値の検証では信頼できる原資料と対象期間・単位を照合し、代表ケースを固定して評価します。',quiz:['プロンプトで例を与えると、通常は？',['重みを更新せず条件として使う','モデル全体を必ず再学習する','語彙をすべて作り直す'],0,'推論時の文脈として利用します。'],sources:['hf','bert']},
{title:'検索とRAG',subtitle:'検索と生成の組み合わせ',time:60,tags:['検索','chunk','RAG評価'],goal:'検索と生成の役割を分け、RAGの失敗箇所を切り分けられる。',summary:'RAGは、質問に関係する情報を検索し、その情報を生成モデルへの入力に加える方法です。検索が正しくても、回答が正しいとは限りません。',sections:[
['RAGの処理の流れ',`${flow(['文書 → chunk','検索用の索引','質問で検索','根拠＋質問','回答'])}<p>文書を小さなまとまり（chunk）に分け、単語ベースの検索やベクトル検索で候補を選びます。必要ならrerankerで候補の順序を再評価し、質問と根拠を生成モデルに渡します。回答に根拠の参照先（どの文書のどの部分か）を含めるようにすると、回答を検証しやすくなります。</p>`],
['chunkの大きさ',`<p>細かすぎる分割は前提や主語を失い、大きすぎる分割は無関係な内容を混ぜます。見出しや文の境界を利用し、文書名・更新日・場所などのメタデータを持たせます。文字数とトークン数は異なるので、生成モデルの入力上限も確認します。</p>`],
['検索と生成を分けて評価する',`${table(['段階','確認すること','例'],[['検索','必要な根拠が候補に入ったか','Recall@k・順位'],['生成','根拠に支えられた回答か','正解性・回答と根拠の一致・引用の正確さ']])}<p>答えが間違っていたら、まず根拠が取得できていたかを見ます。取れていなければ検索や分割、取れていたのに間違えたなら回答生成や指示を検討します。答えが文書にない場合に「不明」と返せるかも評価します。</p>${note('RAGは誤情報を完全には防ぎません。古い文書、検索漏れ、引用の誤対応を別々に検証します。')}`]
],lab:'rag',exercise:['質問の正しい根拠がtop-5に入っているのに回答が誤る場合、どの段階を調べますか？','根拠が存在しない質問への望ましい動作を決めてください。'],answer:'生成段階を調べます。根拠の利用、文脈の競合、指示、引用の対応を確認します。根拠がなければ不明と伝える・確認先を示すなど、用途に応じた基準を先に決めます。',quiz:['RAGの検索評価と回答評価は？',['必ず同じ結果になる','別々に行うと失敗箇所を分けられる','どちらも不要'],1,'根拠を取れなかった失敗と、取れた根拠を使えなかった失敗は異なります。'],sources:['rag']},
{title:'実験と最終課題',subtitle:'実験設計と結果の説明',time:90,tags:['再現性','誤り分析','最終課題'],goal:'ベースライン・評価・誤り分析を含む小さなNLP実験を完成させる。',summary:'最後に、自分で実験を行い、結果を説明します。高いスコアを出すことよりも、比較条件をそろえ、誤りの原因を分析して次の改善につなげることを目標にします。',sections:[
['レビュー分類で実験を一通り行う',`<p>公開範囲や利用条件を確認したレビューなどの文章とラベルを用意します。最初は少数を読み、ラベルの意味・曖昧さ・重複を確かめます。訓練・検証・テストを固定し、多数派ベースライン → TF-IDF＋ロジスティック回帰 → 余力があれば事前学習モデル、の順に比較します。</p>${flow(['タスク定義','データ確認','分割を固定','ベースライン','誤り分析'])}`],
['実験の記録',`${table(['記録項目','書く内容'],[['データ','出典、件数、クラス比、重複の扱い'],['分割','seed、時間・グループ条件、分割ID'],['環境','Python・ライブラリのバージョン'],['設定','前処理、特徴量、ハイパーパラメータ'],['結果','クラス別指標、混同行列、時間'],['失敗例','否定・皮肉・未知語などの分類と原文']])}<p>一度に変える条件を絞ります。改善案は「否定表現の誤りが多いので文字n-gramを試す」のように、観察と結び付けます。テストデータが少ないと、1件の予測結果でスコアが大きく変わるので、件数やばらつきも伝えます。</p>`],
['完成のチェックリスト',`<p>①入力・出力・評価が書ける。②分割前後の漏洩を確認した。③ベースラインと同じ条件で比較した。④少なくとも10件の誤りを読んだ（誤りが少なければ全件）。⑤限界と次の実験を説明できる。ここまでできれば、NLPの学習ループを1周できています。</p><p>次の発展先は、固有表現抽出（BIOラベル）、構文解析、機械翻訳、情報検索、音声処理、LLMの追加学習・評価などです。この12章は共通の土台であり、NLPの全分野を網羅する教材ではありません。</p>`]
],lab:'experiment',exercise:['自分のタスクの実験計画を、入力・出力・データ・分割・ベースライン・評価の6項目で書いてください。','誤りの仮説を1つ立て、その仮説だけを確かめる実験を考えてください。'],answer:'例：レビュー→肯定/否定、ラベル付きデータ、重複を除いた分割、多数派とTF-IDF分類器、macro F1と混同行列。否定に弱いという仮説なら、否定を含む固定の検証例で前処理の有無などを比較します。',quiz:['実験の改善に最も役立つのは？',['テストの答えを見て設定を毎回変更する','誤りを分類し、条件をそろえて仮説を検証する','スコアの低い例を評価から外す'],1,'観察した失敗から仮説を立て、公平な比較で確かめます。'],sources:['slp','hf']}
];

LESSONS[5].time = 85;
LESSONS[5].sections.push(['補講（数式で理解したい人向け）：ベクトルからニューラルネットワークへ', `
<p>この節は、埋め込みやニューラルネットワークを数式で理解したい人向けです。読まなくてもこの章の内容は理解できますが、第7章以降の数式を読むときの前提になります。第2章の内積を使って、行列・層・学習を順に説明します。</p>
<h3>1. 行列を掛けると、複数の特徴を一度に計算できます</h3>
<p>縦に並べたベクトルxに行列Wを掛けると、Wの各行とxの内積が新しい成分になります。以下では、2個の数から別の2個の数を作っています。</p>
${formula('x = [2, 1]ᵀ　　W = [[1, −1], [0.5, 2]]<br>Wx = [1×2 − 1×1,　0.5×2 + 2×1]ᵀ = [1, 3]ᵀ', 'ᵀは転置の記号です。ここでは横に書いた数を縦の列ベクトルとして扱います。')}
<p>一般には、Wがm×d、xがd×1なら、出力はm×1です。内側の次元dが一致することを確認します。第8章のQKᵀも、この行列の掛け算です。</p>
<h3>2. 層は「重み付き変換＋活性化関数」で考えます</h3>
${flow(['入力 x','Wx + b<small>重みとバイアスで変換</small>','ReLU<small>活性化関数</small>','次の層へ'])}
<p>Wは各特徴の重み、b（バイアス）は出力に加える調整値です。ReLU（レルー）は各成分をmax(0, z)に変える関数で、例えば[−2, 3]は[0, 3]になります。このような非線形の変換を挟むことで、線形変換だけでは表せない関係を学べます。</p>
<p>こうした処理のまとまりを「層」と呼び、組み合わせたものがニューラルネットワークです。多くの層を使う学習を深層学習と呼びます。</p>
<h3>3. 重みは、予測の誤りから更新します</h3>
${flow(['入力から予測<small>順伝播</small>','正解と比較<small>損失を計算</small>','各重みへの影響を計算<small>誤差逆伝播</small>','重みを少し更新<small>勾配降下法など</small>'])}
<p>勾配は、重みを少し変えたときに損失がどう変わるかを表します。誤差逆伝播は、出力側から順にこの影響を計算する方法です。損失を下げる方向へ重みを更新する流れを、訓練データで繰り返します。</p>
<h3>4. この章に出てきた用語の確認</h3>
${table(['用語','意味と小さな例'],[
['one-hot表現','語彙［猫, 犬, 鳥］なら、猫=[1,0,0]、犬=[0,1,0]です。'],
['直交','ベクトルの内積が0になる関係です。上の猫と犬のone-hot表現が該当します。'],
['密なベクトル','多くの成分が0ではないベクトルです。学習した埋め込みによく使われます。'],
['pooling（プーリング）','複数のベクトルを1本にまとめます。平均なら[1,2]と[3,4]から[2,3]を得ます。']
])}
<details><summary>確認：ReLU([−1, 0, 2])の結果は？</summary><p>[0, 0, 2]です。負の成分だけが0になります。</p></details>
`]);
{const extra=LESSONS[5].sections[LESSONS[5].sections.length-1];extra[1]=mathbox(extra[1],'補講を開く');}

LESSONS[11].sections.splice(1, 0, ['サンプルデータで分類実験を行う', `
<p>教材用に作成した架空の映画レビュー40件（肯定20件・否定20件）で、処理の流れを確かめます。実在のレビューの収集や外部APIは不要です。似た表現を含む小さなデータなので、得られたスコアを実用上の性能として扱わないでください。</p>
<h3>1. データとコードを同じフォルダに保存します</h3>
<div class="download-actions"><button data-download="reviews.csv">サンプルCSVを保存</button><button data-download="review_classification.py">Pythonコードを保存</button></div>
${table(['CSVの列','内容'],[['id','各レビューを識別するIDです。'],['text','レビュー本文です。分かち書きはしていません。'],['label','positive（肯定）またはnegative（否定）です。']])}
<h3>2. Python環境を用意します</h3>
<p>Python 3.10以上を用意し、2つのファイルを保存したフォルダでターミナルを開きます。最初のライブラリのインストールにはインターネット接続が必要です。仮想環境は、この課題専用のライブラリ置き場です。</p>
<details open><summary>macOS / Linux</summary><pre><code>python3 -m venv .venv
source .venv/bin/activate
python -m pip install numpy scikit-learn
python review_classification.py</code></pre></details>
<details><summary>Windows（コマンドプロンプト）</summary><pre><code>py -m venv .venv
.venv\\Scripts\\activate.bat
python -m pip install numpy scikit-learn
python review_classification.py</code></pre></details>
<h3>3. 結果を順に読みます</h3>
<p>コードは、訓練24件・検証8件・テスト8件に分け、各集合のラベル比を保ちます。random_state=42は乱数の条件を固定する設定です。文字2〜4-gramのTF-IDFを使うので、日本語の形態素解析器を別途導入せずに試せます。</p>
<p>最初に多数派予測を基準として測り、次にロジスティック回帰のCを0.1・1・10で比較します。Cは正則化の強さを調整する設定で、小さい値ほど重みを強く抑えます。検証データのmacro F1で1つを選び、選んだモデルを最後にテストします。</p>
${table(['出力','読み取ること'],[['バージョン・件数・ID','実行条件とデータの分割を記録します。'],['検証macro F1','モデルの設定を選ぶための成績です。'],['テストの分類レポート','precision（適合率）、recall（再現率）、f1-score、support（正解ラベルの件数）を読みます。'],['混同行列・誤り例','どのクラスを取り違えたか、否定表現などに傾向があるかを確かめます。']])}

function fieldsPage(){return `<article class="field-page"><p class="eyebrow">EXPLORE THE FIELD / NLP AT A GLANCE</p><h1>NLPの<em>全体像</em></h1><p class="summary">手法の違いと、解く問題の違い。<br>2つの軸で見ると、今どこを学んでいるかがわかります。</p><div class="axis-intro"><div><span>AXIS 01</span><b>どう解くか</b><p>ルール、統計・機械学習、ニューラルネットワーク、Transformer系モデルの4段階と、応用・評価の枝で見渡します。</p></div><div><span>AXIS 02</span><b>何を解くか</b><p>分類、抽出、翻訳、検索、対話。1つのタスクを複数の手法で解けます。</p></div></div><div class="note">この分類は、おおよその発展順に並べた学習用の整理で、研究分野の厳密な区分ではありません。統計的NLPと機械学習は重なり、ニューラルネットワークは機械学習の一部、Transformerはその一種です。新しい手法が古い手法を完全に置き換えるわけではなく、形態素解析や構文解析などの解析タスクも、どの段階の手法でも解けます。最後の枝は手法ではなく、応用と評価・運用です。</div><div class="map-tools"><label for="field-search">分野・用語を探す<input type="search" id="field-search" placeholder="例：HMM、構文、翻訳"></label><button id="expand-fields">説明をすべて開く</button><button id="collapse-fields">説明をすべて閉じる</button></div><p id="field-status" role="status" aria-live="polite">${NLP_FIELDS.reduce((a,g)=>a+g.items.length,0)}項目 · 項目を開くと説明・例・関連章を表示</p><div class="tree-root"><span class="logo">n.</span><div><b>自然言語処理（NLP）</b><small>ことばを処理するための手法と応用</small></div></div><div class="field-tree">${NLP_FIELDS.map((g,i)=>`<section class="field-branch"><div class="branch-header"><span class="branch-number">0${i+1}</span><div><h2>${g.name}</h2><p>${g.idea}</p></div></div><p class="branch-description">${g.description}</p><div class="branch-items">${g.items.map(fieldItem).join('')}</div></section>`).join('')}</div><p class="field-empty" hidden>該当する項目がありません。検索語を変えてください。</p><section class="task-section"><p class="eyebrow">AXIS 02 / WHAT PROBLEM DO WE SOLVE?</p><h2>「何を解くか」で見る分野</h2><p>上は手法による分類、こちらは解く問題（タスク）による分類です。1つのタスクは複数の手法で解けます。</p><div class="task-grid">${NLP_TASKS.map(([name,io,example,methods,chapter])=>`<div class="task-card"><h3>${name}</h3><div class="task-io">${io}</div><p>${example}。</p><small>手法の例：${methods}</small>${chapter?`<a href="#chapter-${chapter}">関連する第${chapter}章 →</a>`:'<span class="topic-future">発展分野 · 現在の12章では詳説していません</span>'}</div>`).join('')}</div></section><section class="guide"><h3>2つの軸をつなぐ例：感情分析</h3><div class="approaches"><div><b>ルール</b>肯定語・否定語の辞書</div><div><b>統計・線形モデル</b>TF-IDF＋分類器</div><div><b>ニューラルモデル</b>文脈表現＋分類器</div></div><p>解く問題は同じです。必要なデータ、表現、計算量、誤りの傾向が変わります。新しい手法が、すべての用途で古い手法を置き換えるわけではありません。</p></section><section class="guide"><h3>この地図から、どう学ぶ？</h3><p><b>最初の一周：</b> 第1〜5章で、前処理・表現・分類・評価をつなげます。</p><p><b>文脈を理解する：</b> 第6〜9章で、埋め込み・系列・Attention・Transformerを学びます。</p><p><b>応用を作る：</b> 第10〜12章で、LLM・RAG・実験をつなげます。</p><p><b>二周目：</b> 地図で気になった品詞タグ付け、構文解析、Naive Bayes、HMMなどを掘り下げます。</p><a class="primary" href="#home">12章の学習マップへ →</a></section><div class="sources"><b>参考：分野ごとの詳細を調べる</b><a href="https://web.stanford.edu/~jurafsky/slp3/" target="_blank" rel="noopener">Speech and Language Processing · 系列ラベリング・構文解析・検索・音声など ↗</a><p>分類と短い説明は、この教材の学習用に独自に整理しています。</p></div></article>`;}

function bertContextView(mode='both',scene='drink'){
 const both=mode==='both';
 const ending=scene==='drink'?'飲んだ':'読んだ';
 const clues=both?`「彼は」と「を ${ending}」の両方`:'左側の「彼は」だけ';
 const candidates=both?(scene==='drink'?'水・お茶など、飲むもの':'本・雑誌など、読むもの'):'水・本・手紙など、多くの候補が残る';
 return `<div class="bert-tokens" aria-label="${both?'前後の文脈を参照':'左の文脈だけを参照'}"><span class="bert-token">彼は<small>参照できる</small></span><span class="bert-token bert-target">［MASK］<small>予測する位置</small></span><span class="bert-token ${both?'':'bert-unavailable'}">を<small>${both?'参照できる':'参照しない'}</small></span><span class="bert-token ${both?'':'bert-unavailable'}">${ending}<small>${both?'参照できる':'参照しない'}</small></span></div><p><b>使える手掛かり：</b>${clues}</p><p><b>人が考える候補：</b>${candidates}</p><p>${both?'後ろを「飲んだ」から「読んだ」へ変えると、空欄に入るものの種類も変わります。前後の文脈を使う意義がここにあります。':'後ろの文を変えても、左側しか参照しないこの比較では手掛かりが増えません。実際のGPT型モデルは、この空欄を埋めるのではなく、接頭辞から次のトークンを予測します。'}</p>`;
}

 ['穴埋めの事前学習済みBERTへレビューを入れるだけで、感情分類器になる？',['必ずそのまま肯定・否定を返す','［MASK］を全語に付ければ分類できる','通常は分類用の出力層と、タスクに合わせた学習が必要'],2,'穴埋めと感情分類は出力も学習の正解も違います。分類用に調整済みのモデルを使う方法もあります。'],
 ['普通のBERTの［CLS］ベクトルを、そのまま検索に使うと？',['文の意味の近さが必ず測れるわけではない','全モデルで最適な検索表現になる','単語数しか表せない'],0,'文章の代表として使える位置であることと、類似度検索に適した表現であることは別です。検索向けの文埋め込みモデルなどを検討します。']
];
const bertChecksMarkup=()=>`<div class="bert-checks">${BERT_CHECKS.map(([q,options,answer,why],i)=>`<div class="bert-check" data-bert-q="${i}"><h3>Q${i+1}. ${q}</h3><div class="bert-options">${options.map((x,j)=>`<button type="button" data-bert-answer="${j}">${String.fromCharCode(65+j)}. ${x}</button>`).join('')}</div><p class="bert-feedback" role="status" aria-live="polite">選ぶと説明が表示されます。</p><div class="print-only">正解：${options[answer]}。${why}</div></div>`).join('')}</div>`;

const BERT_SECTIONS=[
 ['BERTとは：文章を文脈付きの表現にする',`<p><b>BERT</b>は、Bidirectional Encoder Representations from Transformersの略です。TransformerのEncoderを積み重ね、文章中の各トークンを、周囲の文脈を反映したベクトルへ変換します。2018年にプレプリントが公開され、2019年に論文として発表されました。</p>${flow(['入力の文章','対応するトークナイザ','BERTのEncoder','トークンごとの文脈表現','タスク用の出力層'])}<p>例えば「眼鏡をかける」と「電話をかける」の「かける」は同じ表記でも、周囲が違えば出力の表現も変わります。第6章で学んだ文脈に応じた埋め込みを、Transformerで作る代表例です。</p>${note('ここでいう「理解」は、分類や抽出などに役立つ表現を学ぶという意味です。人間と同じ理解や、事実の正しさを保証するものではありません。')}`],
 ['双方向と穴埋め学習：前後が手掛かりになる',`<p>「彼は［MASK］を飲んだ」なら、後ろの「飲んだ」が、空欄には飲み物が入りそうだという手掛かりになります。BERTの<b>双方向</b>は、入力の前後を各層で参照することです。前から読んで、逆順に読み直すという意味ではありません。</p><p>正解の語をそのまま見せると写すだけで済むため、事前学習では一部のトークンを隠すなどして、元のトークンを予測する<b>Masked Language Modeling（MLM）</b>を行います。正解は元の文章から作れるので、人が全例へ分類ラベルを付ける必要はありません。</p>${flow(['元の文章<small>彼はお茶を飲んだ</small>','一部を隠す<small>彼は［MASK］を飲んだ</small>','元のトークンを予測','正解と比べて重みを更新'])}<p>「水」も自然に見えても、この訓練例の正解は元の「お茶」です。文としてもっともらしい候補と、学習に用意した正解は区別します。図の日本語の区切りは説明用で、実際のトークン分割とは限りません。</p><details><summary>原版BERTの学習をもう少し知る</summary><p>原版では一部のトークンを予測対象に選びますが、選んだ位置が全部［MASK］になるわけではありません。通常の入力にも対応しやすいよう、別のトークンへの置換や、元のままにする場合も含みます。また、二つの文が元の文章で続いていたかを判定するNext Sentence Prediction（NSP）も使います。派生モデルの学習方法は同じとは限りません。</p></details>`],
 ['実験：後ろの文脈が見えると何が変わる？',`<div class="lab bert-demo"><span class="lab-heading">TRY IT YOURSELF · BERT</span><h3>参照範囲と、文の後半を切り替える</h3><p>これは参照範囲を学ぶ概念デモです。BERTやGPTの推論・Attentionの重み・確率は計算していません。</p><label for="bert-mode">参照する文脈</label><select id="bert-mode" data-bert-mode><option value="both">BERT型：前後の文脈</option><option value="left">左の文脈のみ（参照範囲の比較）</option></select><label for="bert-scene">文の後半</label><select id="bert-scene" data-bert-scene><option value="drink">を飲んだ</option><option value="read">を読んだ</option></select><div class="labresult" data-bert-result aria-live="polite">${bertContextView()}</div></div><p>第9章の「全位置」と「causal mask」の違いを、ことばの手掛かりに置き換えて確かめる実験です。</p>`],
 ['入力と出力：［CLS］から分類、各位置から抽出へ',`<p>原版BERTでは、先頭に<b>［CLS］</b>、文の区切りなどに<b>［SEP］</b>を置きます。入力は、対応するトークナイザで作ったIDと位置などの情報です。［CLS］にも、通常のトークンにも出力ベクトルができます。</p>${table(['使い方','どの表現から答える？','出力の例'],[['文章分類','［CLS］位置などの表現＋分類用の層','レビュー → 肯定 / 否定'],['固有表現抽出','トークンごとの表現＋ラベル用の層','人名や組織名の範囲'],['抽出型の質問応答','質問と本文を入力し、本文の位置を予測','本文内の答えの開始・終了位置']])}<p>分類用に<b>ファインチューニング</b>するときは、レビューと肯定・否定の正解で、出力層やBERTの重みを調整します。推論は、調整済みのモデルに新しいレビューを入れて予測する段階です。通常の分類入力に［MASK］を付ける必要はありません。</p>${flow(['穴埋めで事前学習','分類用の層を付ける','ラベル付きレビューで追加学習','新しいレビューを分類'])}${note('［CLS］は、最初からあらゆる用途に最適な「文の要約」ではありません。どう学習し、どの出力層につなぐかで役割が決まります。')}`],
 ['GPTとの違いと、検索での注意',`${table(['観点','通常のBERT','GPT型の自己回帰モデル'],[['構造','Encoder-only','Decoder-only'],['表現を作る参照範囲','入力の前後','各位置の自分と過去（causal）'],['代表的な事前学習','隠したトークンの予測','次のトークンの予測'],['典型的な利用','分類・抽出・文の関係の判定','文章生成・対話']])}<p>これは構造と学習目的の比較です。GPT型でも分類を行えますし、BERTでも予測用の層を付けて穴埋めができます。「BERTは理解、GPTは生成」とだけ分けると、できることを狭く捉えてしまいます。</p><p>検索では、普通のBERTの［CLS］や単純平均をそのまま使えば、意味の近い文が必ず近くなるわけではありません。<b>Sentence-BERT</b>など、文の類似度に適した表現を学習したモデルを使う考え方があります。第11章の検索とつなげて考えましょう。</p><p>モデルを使う際は、対応する日本語トークナイザ、入力長の上限と切り捨て、専門分野の違いを確認します。「悪くない」の否定が切り落とされたり、長い文章の重要部分が入力に入らなかったりすれば、文脈を使えるモデルでも誤ります。</p>`],
 ['BERTの理解チェックと演習',bertChecksMarkup()+`<div class="exercise"><h3>自分の言葉で説明する</h3><ol><li>「彼は［MASK］を飲んだ」と「彼は［MASK］を読んだ」で、後ろの文脈がなぜ役立つか説明してください。</li><li>レビュー分類器を作る場合の、事前学習・追加学習・推論を分けて説明してください。</li></ol><details><summary>解答の例を見る</summary><p>「飲んだ」は飲み物、「読んだ」は本や文章を示す手掛かりになります。事前学習は元の文章から正解を作る穴埋め、追加学習はレビューと感情ラベルで分類用に調整、推論は新しいレビューの分類です。</p></details></div><div class="note"><b>まとめ：</b>BERTは前後の文脈からトークンの表現を作る。穴埋めの学習と、分類用の追加学習は別。分類・抽出・検索では、目的に合った出力層やモデルを選ぶ。</div>`]
];

const RNN_STEPS=[
 ['まだ読んでいない','初期状態から始めます。'],

 ['駅で','前の状態と場所の情報を組み合わせます。'],

function rnnStepMarkup(step=0){
 const tokens=RNN_STEPS.slice(1).map(([word],i)=>`<span class="bert-token ${i+1>step?'bert-unavailable':i+1===step?'bert-target':''}">${word}<small>${i+1>step?'未読':i+1===step?'今回の入力':'読み終えた'}</small></span>`).join('');
 return `<p><b>${step} / 4 段階</b></p><div class="bert-tokens" aria-label="読み終えた位置と、今回の入力">${tokens}</div>${flow([step?'前の状態':'初期状態',step?`今回の入力：${RNN_STEPS[step][0]}`:'まだ入力なし',step?'同じ更新処理を適用':'入力を待つ',step?'新しい状態を次へ':'初期状態'])}<p><b>人の言葉での説明：</b>${RNN_STEPS[step][1]}</p><p>${step>1?'bigramが直接使うのは直前の語だけですが、RNNの状態には、それより前の情報も反映できる仕組みがあります。':'次の段階へ進めると、前の状態と今回の入力を使う流れが見えます。'}</p>`;
}
const RNN_SECTIONS=[
 ['RNNとは：順序のある入力を、状態でつなぐ',`<p><b>RNN（Recurrent Neural Network）</b>は、順に届く入力を処理し、途中の<b>状態</b>を次の段階へ渡すニューラルネットワークです。日本語では再帰型ニューラルネットワークとも呼ばれます。文章だけでなく、音声やセンサーの時系列などにも使える、系列を扱う仕組みです。</p>${flow(['前の状態＋今回の入力','同じ更新処理','新しい状態','次の入力へ'])}<p>文章では、トークンの埋め込みと前の状態から新しい状態を作ります。各位置で別々の処理を用意するのではなく、<b>同じ学習済みの重み</b>を繰り返し使います。処理が同じでも、入力と前の状態が違うので、出てくる状態は変わります。</p>${note('状態は数値のベクトルです。「メモ」というたとえは、文章を丸ごと保存したり、人が読める要約を書いたりするという意味ではありません。必要な情報が必ず残るわけでもありません。')}`],
 ['実験：一つずつ読んで、状態を持ち越す',`<div class="lab rnn-demo" data-rnn-step="0"><span class="lab-heading">TRY IT YOURSELF · RNN</span><h3>「彼女は 駅で 友人に 会った」を順に読む</h3><p>状態の受け渡しを示す概念デモです。実際のRNNの学習・推論や状態ベクトルの計算は行いません。日本語の区切りも説明用です。</p><div class="rnn-actions"><button type="button" data-rnn-action="prev" disabled>一つ戻る</button><button type="button" data-rnn-action="next">次を読む</button><button type="button" data-rnn-action="reset">最初へ戻す</button></div><div class="labresult" data-rnn-result aria-live="polite">${rnnStepMarkup()}</div></div><p>画面の説明は人向けのたとえです。本物の状態に「駅」や「友人」という文字がそのまま書き込まれるわけではありません。</p>`],
 ['何を出力するかで、使い方が変わる',`${table(['タスク','入力と出力の例','状態の使い方'],[['文章分類','レビュー全体 → 肯定 / 否定','最後の状態や複数位置をまとめて分類'],['系列ラベリング','各トークン → 品詞や固有表現のラベル','各位置の状態からラベルを予測'],['言語モデル','ここまでのトークン → 次のトークンの分布','各位置の状態から次を予測']])}<p>RNNは構造の名前で、言語モデルは解く仕事の名前です。RNNを使う言語モデルも、RNNを使う分類器も作れます。第1章の「何を解くか」と「どう解くか」を分けて考えましょう。</p><p>学習では、各段階の予測と正解の違いから重みを調整します。推論では、学習済みの重みを使って状態を更新します。<b>状態が変わること</b>と、<b>重みを学習すること</b>は別です。</p>`],
 ['長い文脈と、LSTM・GRUの工夫',`<p>文章の前半に出た人物や話題が、ずっと後の語に関わることがあります。単純なRNNでは、その情報を何度も状態の更新に通すため、長い関係を学ぶのが難しくなります。学習の信号が小さくなる勾配消失や、大きくなる勾配爆発も関わります。</p><p><b>LSTM</b>と<b>GRU</b>はRNNの仲間です。状態をどう残し、どう更新するかを調整する<b>ゲート</b>を持ちます。ゲートは学習で決まる数値の調整で、人が「この単語を覚える」と指定するスイッチではありません。</p>${table(['方式','状態を扱う考え方','覚えておきたい点'],[['単純なRNN','前の状態と今の入力から新しい状態を作る','長い依存関係の学習が難しい場合がある'],['LSTM','セル状態を持ち、残す・加える・出力する量を調整','隠れ状態とセル状態を区別する'],['GRU','更新・リセットのゲートで状態の混ぜ方を調整','標準的なLSTMより簡潔な構成']])}<p>どちらも長い文脈の扱いを助けますが、無限に正確に覚えられるわけではありません。LSTMとGRUの性能の優劣も、データや用途をそろえて比較します。</p>`],
 ['双方向RNNから、Attention・Transformerへ',`<p>ここまでのデモは前から読む<b>単方向RNN</b>です。文章全体が既にある場合は、前向きと後ろ向きの状態を組み合わせる<b>双方向RNN</b>も使えます。各語の判定に前後の文脈を利用できるため、「双方向はBERTだけの特徴」ではありません。</p><p>一方、次のトークンを予測する言語モデルでは、予測したい未来の正解を見せてはいけません。利用する場面によって参照できる範囲が変わります。</p>${table(['仕組み','情報を渡す道筋','処理上の特徴'],[['RNN・LSTM・GRU','状態を隣の段階へ渡す','次の状態は前の状態を待つ'],['双方向RNN','前向き・後ろ向きの状態を組み合わせる','入力全体が必要で、各方向に順次処理する'],['Self-Attention','各位置が参照できる位置から直接情報を取り込む','系列内の複数位置を並列に計算できる']])}<p>AttentionはRNNと組み合わせることもできます。Transformerは、RNNによる状態の受け渡しを使わず、Attentionを中心に層を組み立てます。ただし、GPT型の通常の文章生成では、まだ決まっていない次のトークンを先に入力できないので、生成は順に進みます。</p><div class="exercise"><h3>理解を確かめる</h3><details><summary>RNNの状態は、文章を丸ごと保存するもの？</summary><p>いいえ。入力と前の状態から作る、固定サイズの数値表現です。全履歴を正確に取り出せる記録ではありません。</p></details><details><summary>LSTMはRNNとは別の分野？</summary><p>いいえ。状態を保つ方法を工夫したRNNの一種です。GRUも同じく、ゲートを使うRNNの仲間です。</p></details><details><summary>RNNとTransformerの違いは「前だけ／前後」？</summary><p>それだけではありません。双方向RNNもあります。重要な違いは、順次更新する状態を介するか、Attentionで参照先から情報を取り込むかです。未来の参照の可否はタスクと構造で決まります。</p></details></div>`]
];

const EXAMPLE_FILES = {"reviews.csv": "id,text,label\np01,この映画は面白くて最後まで楽しめた,positive\np02,俳優の演技が素晴らしく感動した,positive\np03,物語の展開が面白い作品だった,positive\np04,音楽が美しく映像も素晴らしい,positive\np05,笑える場面が多く楽しい映画だった,positive\np06,丁寧な描写で登場人物に共感できた,positive\np07,結末に感動したのでまた見たい,positive\np08,期待以上に面白く友人にもすすめたい,positive\np09,演技が自然で物語に引き込まれた,positive\np10,テンポがよく最後まで飽きずに楽しめた,positive\np11,美しい映像と音楽が印象に残った,positive\np12,心が温かくなる素敵な作品だった,positive\np13,脚本がよくできていて満足した,positive\np14,予想外の展開が楽しく満足できた,positive\np15,家族と一緒に楽しめる良い映画だった,positive\np16,個性的な登場人物が魅力的だった,positive\np17,退屈かと思ったが実際は面白かった,positive\np18,派手さはないが丁寧で良い作品だった,positive\np19,もう一度見たいと思える素晴らしい作品,positive\np20,長い映画だが最後まで夢中で見た,positive\nn01,この映画は退屈で最後まで楽しめなかった,negative\nn02,俳優の演技が不自然でがっかりした,negative\nn03,物語の展開が単調でつまらない,negative\nn04,音楽がうるさく映像も見づらかった,negative\nn05,笑える場面が少なく退屈だった,negative\nn06,説明が足りず登場人物に共感できない,negative\nn07,結末が唐突で納得できなかった,negative\nn08,期待していたのにがっかりした,negative\nn09,演技が不自然で物語に入り込めなかった,negative\nn10,テンポが悪く途中で飽きてしまった,negative\nn11,映像は美しいが物語はつまらなかった,negative\nn12,話が暗いだけで印象に残らない作品,negative\nn13,脚本に矛盾が多く不満が残った,negative\nn14,展開が予想通りで驚きもなくつまらない,negative\nn15,家族と見たが誰も楽しめなかった,negative\nn16,登場人物に魅力を感じなかった,negative\nn17,面白そうだったが実際は退屈だった,negative\nn18,丁寧に見えるが内容が薄く不満だった,negative\nn19,もう一度見たいとは思えない作品だった,negative\nn20,長すぎる映画で時間を無駄に感じた,negative\n", "review_classification.py": "\"\"\"教材用の架空レビュー40件で、分類実験の流れを一周する。\"\"\"\nimport csv\nimport platform\nfrom pathlib import Path\n\nimport sklearn\nfrom sklearn.dummy import DummyClassifier\nfrom sklearn.feature_extraction.text import TfidfVectorizer\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics import classification_report, confusion_matrix, f1_score\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.pipeline import make_pipeline\n\n\ndef main():\n    with Path(__file__).with_name(\"reviews.csv\").open(encoding=\"utf-8\", newline=\"\") as f:\n        rows = list(csv.DictReader(f))\n    if len({r[\"text\"] for r in rows}) != len(rows):\n        raise ValueError(\"同じ文章が重複しています。分割前に確認してください。\")\n    if {r[\"label\"] for r in rows} != {\"negative\", \"positive\"}:\n        raise ValueError(\"labelはnegativeまたはpositiveにしてください。\")\n\n    # まずテスト20%を確保。残り80%のうち25%を検証用にする。\n    train_val, test = train_test_split(\n        rows, test_size=0.2, stratify=[r[\"label\"] for r in rows], random_state=42\n    )\n    train, valid = train_test_split(\n        train_val, test_size=0.25,\n        stratify=[r[\"label\"] for r in train_val], random_state=42\n    )\n    x_train, y_train = [r[\"text\"] for r in train], [r[\"label\"] for r in train]\n    x_valid, y_valid = [r[\"text\"] for r in valid], [r[\"label\"] for r in valid]\n    x_test, y_test = [r[\"text\"] for r in test], [r[\"label\"] for r in test]\n    print(f\"Python {platform.python_version()} / scikit-learn {sklearn.__version__}\")\n    print(f\"件数: train={len(train)}, valid={len(valid)}, test={len(test)}\")\n    for name, split in [(\"train\", train), (\"valid\", valid), (\"test\", test)]:\n        print(name, \"IDs:\", \", \".join(r[\"id\"] for r in split))\n\n    # 多数派を常に予測する基準。今回は同数なので同数時の選択に従う。\n    baseline = DummyClassifier(strategy=\"most_frequent\")\n    baseline.fit([[0]] * len(train), y_train)\n    print(\"多数派の検証macro F1:\", round(f1_score(\n        y_valid, baseline.predict([[0]] * len(valid)), average=\"macro\", zero_division=0\n    ), 3))\n\n    # 空白のない日本語を、文字2〜4-gramで数値化する。\n    # 語彙とIDFも訓練側だけで学習する。\n    best_score, best_c, best_model = -1, None, None\n    for c in [0.1, 1.0, 10.0]:\n        model = make_pipeline(\n            TfidfVectorizer(analyzer=\"char\", ngram_range=(2, 4)),\n            LogisticRegression(C=c, max_iter=1000, random_state=42)\n        )\n        model.fit(x_train, y_train)\n        score = f1_score(y_valid, model.predict(x_valid), average=\"macro\", zero_division=0)\n        print(f\"C={c}: 検証macro F1={score:.3f}\")\n        if score > best_score:\n            best_score, best_c, best_model = score, c, model\n\n    # 検証で選んだ学習済みモデルを、ここで一度だけテスト評価する。\n    pred = best_model.predict(x_test)\n    print(f\"\\n採用したC: {best_c}\")\n    print(\"多数派のテストmacro F1:\", round(f1_score(\n        y_test, baseline.predict([[0]] * len(test)), average=\"macro\", zero_division=0\n    ), 3))\n    print(classification_report(\n        y_test, pred, labels=[\"negative\", \"positive\"], digits=3, zero_division=0\n    ))\n    print(\"混同行列: 行=正解、列=予測。順序=negative, positive\")\n    print(confusion_matrix(y_test, pred, labels=[\"negative\", \"positive\"]))\n    print(\"\\nテストの誤り例:\")\n    errors = 0\n    for row, guess in zip(test, pred):\n        if guess != row[\"label\"]:\n            errors += 1\n            print(f'{row[\"id\"]}: 正解={row[\"label\"]}, 予測={guess}, 本文={row[\"text\"]}')\n    if errors == 0:\n        print(\"この分割では誤りなし。実データでの性能を保証する結果ではありません。\")\n    print(\"\\n架空の少量データによる手順確認です。スコアを一般化しないでください。\")\n\n\nif __name__ == \"__main__\":\n    main()\n"};

LESSONS[0].sections[0]=['自然言語とは何か',paragraph('<b>自然言語</b>は、日本語や英語のように、人が日常で使うことばです。Pythonのようなプログラミング言語は、コンピュータに処理を指示するために文法や規則を定めた言語です。','自然言語は、同じ表現でも文脈によって意味が変わります。「赤い帽子と靴」は、帽子だけが赤いのか、靴も赤いのか、この表現だけでははっきりしません。人は前後の話や状況から補います。')+table(['見る点','自然言語','プログラミング言語'],[['文法','言い換えや省略が多い','決められた文法に従う'],['解釈','状況や文脈に頼ることがある','規則に沿って構文を解釈する'],['誤り','多少の誤字でも意味を推測できることがある','文法に合わない書き方はエラーになる']])+paragraph('プログラムも、一文字変えたら必ずエラーになるわけではありません。実行できても意図と違う結果になることがあります。「自然言語は文脈による解釈が大きい」という違いに注目しましょう。')];

LESSONS[3].sections=[
 ['BoW：使われた語を数える',paragraph('<b>Bag of Words（BoW）</b>は、文章にどの語が何回出るかを数える方法です。語彙を［猫、犬、好き］の順に並べた表なら、「猫 猫 好き」は［2、0、1］になります。', '語順は残りません。「猫が犬を追う」と「犬が猫を追う」は同じ語と回数なので、BoWだけでは追う側を区別できません。')+table(['文章','猫','犬','好き'],[['猫 猫 好き','2','0','1'],['犬 好き','0','1','1']])+note('多くの語は一つの文書には出てこないため、表の値は0だらけになります。0を省いてコンパクトに持つ方法を「疎な表現」と呼びます。')],
 ['TF-IDF：その文書らしい語を目立たせる',paragraph('<b>TF-IDF</b>は、その文書によく出て、ほかの文書にはあまり出ない語を目立たせる点数です。ニュース全体に出る「の」より、野球の記事に集中する「ホームラン」のほうが、野球の記事を見分ける手掛かりになります。')+table(['用語','答える問い','読み方'],[['TF：単語の出現頻度','この文書に何回出る？','よく出るほど高くなる'],['DF：文書頻度','この語を含む文書はいくつ？','同じ文書に何度出ても、その文書は一件'],['IDF：逆文書頻度','ほかの文書にもよく出る？','多くの文書に出る語ほど低くなる']])+example('3記事で「の」と「ホームラン」が野球の記事にそれぞれ3回出たとします。「の」は3記事全部、「ホームラン」は野球の記事だけに出るなら、出現回数が同じでも「ホームラン」を強く目立たせます。')+mathbox(formula('idf(t) = ln((N + 1) / (df(t) + 1)) + 1<br>tfidf(t, d) = count(t, d) × idf(t)','この教材の実験はscikit-learnの平滑化ありの式。Nは文書数、dfは語を含む文書数。文書ごとの長さをそろえるL2正規化は、デモでは行いません。'))],
 ['訓練・検証・テスト：練習と本番を分ける',paragraph('語彙とIDFを作るのは、訓練データだけです。まだ見ていない文書をどのくらいうまく扱えるか測るため、検証・テストデータを混ぜて作らないようにします。','ライブラリで<b>fit</b>はデータから変換のルールを決める処理、<b>transform</b>は決めたルールを新しい文章に適用する処理です。詳しい役割は第5章で学びます。')+flow(['訓練だけで語彙・IDFを作る','同じルールを新しい文書に適用','結果を評価する'])]
];

LESSONS[5].goal='埋め込みの役割と、静的な表現・文脈に応じた表現・文の表現の違いを説明できる。';

 ['同じ語でも、文脈で意味が変わる',table(['文','「かける」の意味'],[['電話をかける','電話で連絡する'],['眼鏡をかける','眼鏡を身に着ける']])+paragraph('<b>Word2Vec</b>などの静的埋め込みは、同じ語に一つのベクトルを割り当てます。一方、<b>BERT</b>などは周りの文脈を使って、各位置の表現を作ります。入力時の語のベクトルと、文脈を反映した出力のベクトルを区別しましょう。','この章の実験では、二つの文の「かける」に同じ表現を割り当てる場合と、文脈を使って表現を変える場合を切り替えます。')],
 ['単語の表現と、文全体の表現を分ける',paragraph('BERTのようなモデルからは、トークンごとにベクトルが出ます。文章を丸ごと比較するには、複数のベクトルをまとめる工程が必要です。この工程を<b>pooling（プーリング）</b>と呼び、平均を取る方法などがあります。')+flow(['文章','トークンごとの表現','まとめる（pooling）','文全体の表現'])+paragraph('ただし普通のBERTの出力を平均しただけで、類似度検索に適した表現になるとは限りません。<b>Sentence-BERT</b>など、文同士の関係を学習したモデルを選ぶ方法があります。第11章の検索で扱う、文章を比べる表現につながります。')],
 ['類似度：近いことと、同じ意味は別',paragraph('<b>コサイン類似度</b>は、数の並びを矢印と考えたとき、向きがどれだけそろうかを測る値です。向きがそろうほど高くなります。計算を知らなくても「比較のための点数」と考えて進めます。','高い類似度でも、否定や数字の違いを見落とす場合があります。「好き」と「好きではない」が近く出るなら、その用途に十分なモデルかを確認します。検索では代表的な質問と、見つけるべき文書で評価します。')+mathbox(formula('cos(a, b) = (a・b) / (||a|| ||b||)','内積を二つのベクトルの長さで割ります。値は−1〜1で、ゼロベクトルでは定義できません。数値と意味の関係は、学習したモデルや用途で異なります。'))]

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='nlp-learning-v1';
function lessonSearchText(l){
  const prose=[l.title,l.subtitle,l.goal,l.summary,...l.tags,...l.sections.flat(),...l.exercise,l.answer,...l.quiz.flat()];
  return (prose.join(' ').replace(/<[^>]*>/g,' ')+' '+(l.code||'')).normalize('NFKC').toLowerCase();
}
function bindDownloads(){
  document.querySelectorAll('[data-download]').forEach(button=>button.onclick=()=>{
    const name=button.dataset.download;
    if(!Object.prototype.hasOwnProperty.call(EXAMPLE_FILES,name))return;
    const url=URL.createObjectURL(new Blob([EXAMPLE_FILES[name]],{type:'text/plain;charset=utf-8'}));
    const link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
  });
}
function cleanPrintDocument(){

}

function softmax(xs,t=1){const m=Math.max(...xs);const es=xs.map(x=>Math.exp((x-m)/t));const total=es.reduce((a,b)=>a+b,0);return es.map(x=>x/total);}

確認する。</p><p><b>2. 変えてみる。</b> 場面や条件を変え、結果を予想してから見る。</p><p><b>3. 説明して残す。</b> 理解チェックと演習に答え、メモに自分の説明を書く。</p><p><b>一周目は概念から：</b>具体例・図・実験・理解チェックを読み進めます。「数式で確認する」とPythonコードは任意です。二周目で計算や実装を確かめられます。</p><p>各章の時間は初めて学ぶ場合の学習時間の目安です。Pythonの実行は別の環境で行います。最終課題には追加の実装時間を取りましょう。</p></div><div class="sectionhead"><h2>4週間の進め方</h2><small>週3回＋復習。ペースは自由です。</small></div><div class="schedule">${['1〜3章：全体像・数の考え方・前処理','4〜6章：TF-IDF・評価・埋め込み','7〜9章：系列・Attention・Transformer','10〜12章：LLM・RAG・最終課題'].map((x,i)=>`<div><b>Week ${i+1}</b>${x}<br>章を読む → 演習 → 復習</div>`).join('')}</div><div class="sectionhead"><h2>深く学ぶための参考資料</h2></div><div class="sources"><p>教材は独自の入門解説です。詳細や実装仕様は各章の参考資料で確認できます。</p>${['slp','hf','attention','tfidf'].map(k=>`<a href="${SOURCES[k][1]}" target="_blank" rel="noopener">${SOURCES[k][0]} ↗</a>`).join('')}</div></div>`;}

だけに保存します。別端末には同期されません。</small></div><div class="lesson-bottom"><a href="${i?`#chapter-${i}`:'#home'}">← ${i?'前の章':'学習マップ'}</a><button class="primary" id="complete">${state.done.includes(i)?'✓ 完了済み（取り消す）':'この章を完了にする'}</button><a href="${i<11?`#chapter-${i+2}`:'#home'}">${i<11?'次の章':'学習マップ'} →</a></div>`}<div class="sources"><b>参考資料</b>${l.sources.map(k=>`<a href="${SOURCES[k][1]}" target="_blank" rel="noopener">${SOURCES[k][0]} ↗</a>`).join('')}</div></article>`;}
function labMarkup(kind){switch(kind){
case 'task':return '<h3>タスクを選び、入力と出力を確認</h3><label for="task">目的</label><select id="task"><option value="0">感情分類</option><option value="1">固有表現抽出</option><option value="2">文書検索</option><option value="3">翻訳</option></select><div class="labresult" id="result" aria-live="polite"></div>';
case 'softmax':case 'sampling':return `<h3>${kind==='sampling'?'温度を変えて、次トークンの分布を見る':'同じスコアでも、温度で確率は変わる'}</h3><p>候補「猫・犬・鳥」の架空のlogitは [2, 1, 0]。</p><label for="temperature">温度 T：<output id="temp-value">1.00</output></label><input id="temperature" type="range" min="0.1" max="3" step="0.05" value="1"><div class="labresult" id="result" aria-live="polite"></div>${kind==='sampling'?'<button id="sample">分布から1つ抽選する</button><span id="sampled" role="status"></span>':''}`;
case 'tokenize':return '<h3>同じ文章を、異なる単位で分割</h3><label for="text">文章（最大200文字）</label><input id="text" maxlength="200" value="ＡＩ について学ぶ"><label for="unit">分割単位</label><select id="unit"><option value="char">文字単位</option><option value="space">空白単位</option></select><p>これは分割の基本を観察する実験です。日本語の形態素解析・BPEは実行していません。</p><div class="labresult" id="result" aria-live="polite"></div>';

case 'metrics':return "<h3>迷惑メールを、どこまで拾う？</h3><p>迷惑メール20通・普通のメール80通がある架空の例です。判定の条件を切り替え、見逃しと誤検出がどう変わるか予想してください。実際のモデルは動かしていません。</p><label for=\"metric-scenario\">迷惑と判定する条件</label><select id=\"metric-scenario\"><option value=\"strict\">強い確信があるものだけ</option><option value=\"balanced\" selected>標準の条件</option><option value=\"broad\">疑わしいものも幅広く拾う</option></select><div class=\"labresult\" id=\"result\" aria-live=\"polite\"></div>";

case 'bigram':return '<h3>直前の1語で予測する</h3><p>架空の学習カウントに基づく、平滑化なしのbigramです。文頭・文末は省略しています。</p><label for="previous">直前の語</label><select id="previous"><option>猫</option><option>が</option><option>好き</option></select><div class="labresult" id="result" aria-live="polite"></div>';
case 'attention':return "<h3>「それ」に、どの語の情報を取り込む？</h3><p>参照先を切り替える概念デモです。人が選んだ語の情報を取り込む図であり、実際のAttentionの重みを計算するものではありません。</p><label for=\"attention-scene\">文の場面</label><select id=\"attention-scene\"><option value=\"cake\">彼女はケーキを買い、それを食べた</option><option value=\"book\">彼女は本を借り、それを読んだ</option></select><label for=\"attention-focus\">「それ」が取り込む情報の参照先</label><select id=\"attention-focus\"><option value=\"object\">ケーキ／本</option><option value=\"person\">彼女</option></select><div class=\"labresult\" id=\"result\" aria-live=\"polite\"></div>";
case 'mask':return '<h3>どの位置が、どの位置を参照できる？</h3><label for="mask">マスク</label><select id="mask"><option value="causal">causal：過去と自分だけ</option><option value="full">全位置：双方向</option></select><p>行はQuery、列はKey。●は参照できる位置、—は参照できない位置です。</p><div class="labresult" id="result"></div>';

function initLab(kind, root=document, interactive=true){const $=s=>root.querySelector(s);const result=$('#result');const update=()=>{switch(kind){
case 'task':{const k=Number($('#task').value);result.innerHTML=[['レビュー：「とても面白かった」','出力：肯定','評価：F1・混同行列'],['文章：「田中さんは東京で働く」','出力：田中→人名、東京→地名','評価：範囲とラベルの一致'],['質問：「NLPの教材は？」','出力：関連文書を順位付きで返す','評価：Recall@k・MRR'],['原文：「猫が好きです」','出力：I like cats.','評価：自動指標と人による評価']][k].map(x=>`<div>${x}</div>`).join('');break;}
case 'softmax':case 'sampling':{const t=Number($('#temperature').value);$('#temp-value').value=t.toFixed(2);const ps=softmax([2,1,0],t);result.innerHTML=bars(['猫','犬','鳥'],ps)+`<p><b>${t<0.7?'一位の「猫」に確率が集中しています。':t>1.7?'候補の確率の差が縮まり、「犬」「鳥」も選ばれやすくなります。':'「猫」が一位ですが、ほかの候補にも確率があります。'}</b></p><p>温度を変えてもスコアの順位は同じです。候補にどれくらい確率を配るかが変わります。${kind==='sampling'?'抽選では、一位以外が出ることもあります。':'ここでは正解を「猫」と考えます。「猫」に高い確率を付けるほど、損失は小さくなります。'}</p>`+ (kind==='softmax'?mathbox(`<p>確率の合計：${ps.reduce((a,b)=>a+b,0).toFixed(3)}。正解が猫なら交差エントロピー損失：${(-Math.log(ps[0])).toFixed(3)}。</p>`):'');break;}
case 'tokenize':{const s=$('#text').value;const normalized=s.normalize('NFKC').replace(/\s+/g,' ').trim();const tokens=$('#unit').value==='char'?Array.from(normalized).filter(x=>!(/\s/.test(x))):normalized.split(/\s+/).filter(Boolean);result.innerHTML=`<p>正規化後：${esc(normalized)||'（空）'}</p><div class="tokenrow" style="justify-content:flex-start">${tokens.map(t=>`<span class="token">${esc(t)}</span>`).join('')}</div><p>${tokens.length} トークン${$('#unit').value==='char'?'（空白は除外）':''}</p>`;break;}
case 'tfidf':{const docs=$('#docs').value.split('\n').map(d=>d.trim().split(/\s+/).filter(Boolean)).filter(d=>d.length);if(!docs.length){result.textContent='文書を入力してください。';break;}const vocab=[...new Set(docs.flat())].slice(0,20);result.innerHTML=table(['語','df','IDF',...docs.map((_,i)=>`文書${i+1} TF-IDF`)],vocab.map(t=>{const df=docs.filter(d=>d.includes(t)).length;const idf=Math.log((docs.length+1)/(df+1))+1;return [esc(t),df,idf.toFixed(3),...docs.map(d=>(d.filter(x=>x===t).length*idf).toFixed(3))];}));const rare=vocab.reduce((best,t)=>docs.filter(d=>d.includes(t)).length<docs.filter(d=>d.includes(best)).length?t:best);const df=docs.filter(d=>d.includes(rare)).length;result.innerHTML+=`<p><b>「${esc(rare)}」は${docs.length}文書中${df}文書に出ています。</b></p><p>${df===docs.length?'どの文書にも出るので、この語だけでは文書を見分けにくくなります。':'同じ出現回数なら、多くの文書に出る語より強く目立たせる手掛かりになります。'} 文書を追加して、この語がありふれた語になるとどう変わるか確かめましょう。</p>`;break;}
case 'metrics':{const scenario=$('#metric-scenario').value;const [tp,fp,fn,tn]={strict:[10,1,10,79],balanced:[16,4,4,76],broad:[19,20,1,60]}[scenario];const p=tp/(tp+fp),r=tp/(tp+fn);result.innerHTML=table(['結果','通数','何が起きた？'],[['正しく検出（TP）',tp,'迷惑メールを止めた'],['見逃し（FN）',fn,'迷惑メールが受信箱へ届いた'],['誤検出（FP）',fp,'普通のメールを誤って止めた'],['正しく通した（TN）',tn,'普通のメールが受信箱へ届いた']])+`<p><b>${scenario==='strict'?'誤検出は少ない一方、迷惑メールの半分を見逃します。':scenario==='broad'?'見逃しは減りましたが、普通のメール20通も止めています。':'見逃しと誤検出が、それぞれ4通あります。'}</b></p><p>Precision（判定したものの正しさ）：${Math.round(p*100)}%。Recall（迷惑メールを拾えた割合）：${Math.round(r*100)}%。</p><p>大事なメールを止める害と、迷惑メールを通す害を比べ、使う目的に合う条件を選びます。この架空の結果は、特定のしきい値の実測値ではありません。</p>`;break;}
case 'embedding':{const contextual=$('#embedding-mode').value==='contextual';result.innerHTML=table(['入力の文','「かける」の表現をどう作る？'],[['電話をかける',contextual?'周囲の「電話」を反映した表現':'同じ語IDに割り当てた表現'],['眼鏡をかける',contextual?'周囲の「眼鏡」を反映した表現':'同じ語IDに割り当てた表現']])+(contextual?'<div class="bert-tokens"><div class="bert-token">表現A<small>電話の文脈を反映</small></div><div class="bert-token">表現B<small>眼鏡の文脈を反映</small></div></div>':flow(['電話／眼鏡のどちらでも','同じ「かける」の表現']))+`<p><b>${contextual?'同じ語でも、周囲の違いを出力の表現に反映できます。':'この段階では、同じ語に同じ表現を使います。二つの意味は区別されていません。'}</b></p><p>${contextual?'BERTなどでは、入力の埋め込みを文脈を使って加工し、トークンごとの表現を作ります。意味を完全に理解できる保証ではありません。':'Word2Vecなどの静的な単語表現を示しています。この表現を別の文脈処理のモデルに渡すことはできます。'}</p>`;break;}
case 'bigram':{const k=$('#previous').value;const data={'猫':[['が','は'],[3,1]],'が':[['好き','走る'],[2,2]],'好き':[['です','だ'],[4,1]]};const [ls,cs]=data[k];result.innerHTML=`<p>「${k}」の後のカウント：${ls.map((l,i)=>`${l}=${cs[i]}`).join('、')}</p>`+bars(ls,cs.map(c=>c/cs.reduce((a,b)=>a+b,0)));break;}
case 'attention':{const cake=$('#attention-scene').value==='cake',object=$('#attention-focus').value==='object';const target=object?(cake?'ケーキ':'本'):'彼女';result.innerHTML=flow([`参照先：${target}`,`取り込む内容：${target}の情報`,'「それ」の表現へ'])+`<p><b>${object?`「それ」が指す${target}の情報を取り込むと、何を${cake?'食べた':'読んだ'}かを表す手掛かりになります。`:'人物の情報を取り込む設定にしましたが、何を食べた／読んだのかを表す手掛かりは不足します。'}</b></p><p>Queryは「それ」の位置が探す情報、Keyは参照先を照合する目印、Valueは取り込む内容、と考えます。実際には複数の位置のValueを重みに応じて混ぜます。この図は参照先の役割を一つずつ見るための簡略化です。</p>`;break;}
case 'mask':{const full=$('#mask').value==='full',words=['彼女','は','ケーキ','を','食べた'];result.innerHTML=table(['参照する位置 ↓ / 参照先 →',...words.map((w,i)=>`${i+1}：${w}`)],words.map((w,i)=>[`${i+1}：${w}`,...words.map((_,j)=>full||j<=i?'●':'—')]))+`<p><b>3番目の「ケーキ」は、${full?'後ろの「を」「食べた」も参照できます。':'自分までの位置だけを参照し、後ろの「を」「食べた」は参照できません。'}</b></p><p>「未来」は、ここでは入力の後ろにあるトークンのことです。次を予測する学習では、後ろの正解を見せないようにします。</p>`;break;}
case 'rag':{const docs=['講座の開催日は11月1日です。','講座の参加費は無料です。','講座の場所はオンラインです。'];const grams=s=>{const a=Array.from(s.replace(/[\s？?。、]/g,''));return new Set(a.slice(0,-1).map((c,i)=>c+a[i+1]));};const q=grams($('#query').value);const ranked=docs.map((d,i)=>{const g=grams(d);const intersection=[...q].filter(t=>g.has(t)).length;const union=new Set([...q,...g]).size;return {d,i,score:union?intersection/union:0};}).sort((a,b)=>b.score-a.score);result.innerHTML=ranked.map((r,i)=>`<p><b>${i+1}位 · 文書${r.i+1}</b> / 類似度 ${r.score.toFixed(3)}<br>${esc(r.d)}</p>`).join('')+'<p>スコアは回答の確かさではありません。関係がない質問でも候補が並ぶので、根拠の有無を確認します。</p>';break;}
case 'experiment':{result.textContent=`入力・出力：${$('#purpose').value}\nベースライン：${$('#baseline').value}\n評価・分割：${$('#evaluation').value}`;result.style.whiteSpace='pre-wrap';break;}
}};update();if(!interactive)return;result.closest('.lab').querySelectorAll('input,select,textarea').forEach(el=>el.addEventListener('input',update));if(kind==='sampling')$('#sample').onclick=()=>{const ps=softmax([2,1,0],Number($('#temperature').value)),r=Math.random();let sum=0,index=2;for(let j=0;j<ps.length;j++){sum+=ps[j];if(r<sum){index=j;break;}}$('#sampled').textContent=` → 抽選結果：${['猫','犬','鳥'][index]}`;};if(kind==='experiment')$('#copy-plan').onclick=()=>copyText(result.textContent,$('#plan-status'));}
async function copyText(text,target){try{await navigator.clipboard.writeText(text);target.textContent='コピーしました';}catch{target.textContent='コピーできません。表示された本文を選択してコピーしてください。';}}
function render(focus=false){nav();const match=location.hash.match(/^#chapter-(\d+)$/);const i=match?Number(match[1])-1:-1;if(location.hash==='#fields'){$('#main').innerHTML=fieldsPage();document.title='NLPの分野マップ｜NLP Learning Lab';initFields();}else if(i<0||i>=LESSONS.length){$('#main').innerHTML=home();document.title='自然言語処理入門｜NLP Learning Lab';}else{const l=LESSONS[i];$('#main').innerHTML=lesson(i);document.title=`第${i+1}章 ${l.title}｜NLP Learning Lab`;initLab(l.lab);$('#complete').onclick=()=>{state.done=state.done.includes(i)?state.done.filter(v=>v!==i):[...state.done,i];const stored=save();nav();$('#complete').textContent=state.done.includes(i)?'✓ 完了済み（取り消す）':'この章を完了にする';if(!stored)$('#memo-status').textContent='ブラウザ保存が使えないため、再読込すると進捗が消えます。';};$('#memo').oninput=()=>{state.notes[i]=$('#memo').value;$('#memo-status').textContent=save()?'メモをこのブラウザに保存しました。':'保存できません。メモをコピーして手元に残してください。';};document.querySelectorAll('.qitem').forEach(item=>{const [, , answer,why]=quizzesOf(l)[Number(item.dataset.quizIndex)];item.querySelectorAll('.answer').forEach(btn=>btn.onclick=()=>{const correct=Number(btn.dataset.answer)===answer;item.querySelectorAll('.answer').forEach(b=>b.classList.remove('correct','wrong'));btn.classList.add(correct?'correct':'wrong');item.querySelector('.feedback').textContent=(correct?'正解です。':'もう一度考えてみましょう。')+' '+why;});});if(l.code)$('.copy').onclick=()=>copyText(l.code,$('.copy'));bindDownloads();}if(focus){window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true});}}
$('#search').oninput=nav;
$('.skip').onclick=e=>{e.preventDefault();$('#main').focus();};
window.addEventListener('hashchange',()=>render(true));
$('#print').onclick=()=>{preparePrintDocument();window.print();};
window.addEventListener('afterprint',cleanPrintDocument);
render();
</script></body></html>
