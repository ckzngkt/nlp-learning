{title:'NLPの全体像',subtitle:'タスクを入力・出力・評価で定義する',time:35,tags:['タスク','データ','ベースライン'],goal:'自然言語とは何かを説明でき、自然言語処理の問題を「入力・出力・評価」の3つで定義できる。',summary:'自然言語処理（NLP）は、人間のことばをコンピュータで扱う技術です。モデルを選ぶ前に、何を入力し、何を答えてほしいのかを決めます。',sections:[
['自然言語とは何か',`<p><b>自然言語</b>とは、日本語・英語・中国語のように、人間が日常の会話や文章で自然に使うことばです。これに対して、Python や SQL のように、コンピュータに命令するために人間が決めたルールで作った言語を<b>人工言語</b>（形式言語）と呼びます。</p>${table(['','自然言語（日本語など）','人工言語（Pythonなど）'],[['文法','例外が多く、話し手によって揺れる','厳密に決まっている'],['意味','文脈で変わる（曖昧さがある）','1通りに決まる'],['誤り','多少間違っていても通じる','1文字違うとエラー'],['変化','新しい言葉や使い方が増え続ける','仕様変更は管理されている']])}<p>例えば「彼は眼鏡をかけた女性を見た」は、眼鏡をかけているのが彼なのか女性なのか、文だけでは決まりません。人間は状況から判断しますが、Python のコードにこのような曖昧さがあれば実行できません。</p>`],
['自然言語処理（NLP）とは',`<p>コンピュータが内部で扱えるのは、数値（0 と 1）だけです。文字も、文字コードという番号に置き換えて保存しています。ただし、番号を保存できることと、<b>意味を扱えること</b>は別です。「うれしい」と「楽しい」が近い意味であることは、文字コードの数字を見てもわかりません。</p><p><b>自然言語処理（Natural Language Processing, NLP）</b>は、この自然言語をコンピュータで扱えるようにする技術の分野です。身近な例として、次のものがあります。</p><ul><li>検索エンジンやスマートフォンの予測変換</li><li>機械翻訳、音声アシスタント、チャットボット</li><li>迷惑メールの判定、レビューの肯定・否定の分類</li><li>ChatGPT のような大規模言語モデル（LLM）</li></ul>${flow(['人間のことば（文章）','数値に変換','計算で処理','結果（分類・翻訳・回答など）'])}<p>この教材の各章は、「文章をどう数値にするか」「その数値からどう答えを出すか」を順に学ぶ構成です。</p>`],
['ことばを扱う仕事を分解する',`<p>「このレビューは肯定的？」は分類、「文章中の会社名は？」は抽出、「この質問の根拠はどの文書？」は検索です。翻訳や要約は新しい文章を出力する生成タスクです。同じ文章でも、目的によって必要な正解データが変わります。</p>${table(['タスク','入力 → 出力','評価の一例'],[['感情分類','レビュー → 肯定 / 否定','F1・混同行列'],['固有表現抽出','文章 → 人名・組織名の範囲','範囲と種類の一致によるF1'],['文書検索','質問 → 関連文書の順位','Recall@k・MRR'],['翻訳・要約','原文 → 別言語 / 短い文章','自動指標＋人による評価']])}`],
['まずは、小さな学習ループ',`<p>多くの教師あり学習では、文章と正解の組を集め、文章を数値にし、予測と正解のズレを小さくするようにモデルを調整します。実際に新しい文章を予測する処理が「推論」です。</p>${flow(['文章＋正解','前処理','数値表現','モデル','予測＋評価'])}<p>まず「多数派をいつも答える」だけのモデルを作ると、最低限の比較対象になります。TF-IDF＋線形分類器も有力なベースラインです。複雑なモデルが役に立つかは、同じ評価条件で比較します。</p>`],
['なぜことばは難しい？',`<p>「この映画、悪くない」は「悪い」という語を含んでも肯定的です。「銀行」と「川岸」を意味する英語の bank は文脈で意味が変わります。省略、皮肉、表記揺れ、専門分野の違いもあります。単語数だけを見る方法から、文脈を使う方法へ進む理由はここにあります。</p>${note('モデルの高得点だけで「ことばを完全に理解した」とは言えません。どんな入力で成功し、どんな入力で失敗したかを確かめます。')}`]
],lab:'task',exercise:['レビュー分類の入力・出力・評価指標を書いてください。','「肯定をいつも返す」モデルが、肯定80件・否定20件のデータで得るAccuracyを計算してください。'],answer:'入力はレビュー本文、出力は肯定／否定などのラベル。Accuracyは80%ですが、否定的なレビューを1件も見つけられません。クラス別のRecallも見る必要があります。',quiz:['翻訳の出力はどれ？',['文章ごとの1個の分類ラベル','別の言語の文章','関連文書の順位'],1,'タスクごとに出力の形が異なります。翻訳は文章を生成します。'],sources:['slp']},
{title:'数学・確率の道具',subtitle:'確率と数式を実験で確認する',time:50,tags:['ベクトル','softmax','交差エントロピー'],goal:'ベクトル・確率・損失がモデルの中で果たす役割を説明できる。',summary:'数学を全部終えてから始める必要はありません。NLPでよく使う「数の並び」「確率の分布」「予測のズレ」を、具体的な数値から学びます。',sections:[
['ベクトルは特徴の並び',`<p>文章を x = [2, 0, 1] と表すと、3つの特徴の強さを保持できます。重み w = [0.5, −1, 2] と内積を取ると、x・w = 2×0.5 + 0×(−1) + 1×2 = 3。内積は対応する成分の積を足した値です。</p><p>行列はベクトルをまとめたものです。B件の文をd次元で表す行列なら、形は B×d。計算の前後で「どの軸が何を表すか」を確認すると、実装のバグを見つけやすくなります。</p>`],
['スコアを確率に変える',`<p>モデルが出す生のスコアをlogit（ロジット）と呼びます。softmaxは各スコアを指数関数で正の値にして、合計で割ります。結果は合計1の分布になります。計算では最大スコアを引くと、指数関数の値が大きくなりすぎるのを防げます。</p>${formula('pᵢ = exp(zᵢ / T) / Σⱼ exp(zⱼ / T)','T > 0 は温度。Tを小さくすると分布が鋭く、大きくすると平らになります。')}`],
['損失を小さくする',`<p>正解が1つの分類では交差エントロピー L = −log(p正解) を使えます。正解の確率が0.8なら損失は約0.223、0.1なら約2.303。間違いに強く自信を持つ予測を大きく罰します。勾配はパラメータをどの方向に動かすと損失が変わるかを表し、勾配降下法は損失を下げる向きに少しずつ更新します。</p>${note('モデルの確率が0.9でも、現実で必ず90%正しいとは限りません。確率の信頼性（キャリブレーション）は別に評価します。')}`]
],lab:'softmax',code:'import math\n\nz = [2.0, 1.0, 0.0]\nm = max(z)\ne = [math.exp(v - m) for v in z]\np = [v / sum(e) for v in e]\nprint(p)  # 約 [0.665, 0.245, 0.090]\nprint(-math.log(p[0]))  # 正解が先頭なら約 0.408',exercise:['x=[1,2]、w=[3,4]の内積を計算してください。','正解の確率が0.5から0.9に上がると、交差エントロピーはどう変わりますか？'],answer:'内積は11。損失は約0.693から約0.105へ下がります。',quiz:['温度Tを大きくするとsoftmaxは？',['より平らになる','必ず同じ1項目が確率1になる','負の確率を返す'],0,'温度を大きくするとスコア間の差が相対的に小さくなります。'],sources:['slp']},
{title:'テキスト前処理',subtitle:'トークン化と正規化',time:45,tags:['正規化','形態素解析','サブワード'],goal:'文字・単語・サブワードの違いと、前処理の副作用を説明できる。',summary:'モデルは文章をそのまま読むのではなく、トークンの列として処理します。日本語は空白で単語が区切られないため、分割の方法を意識することが大切です。',sections:[
['表記をそろえる',`<p>Unicode正規化（NFKC）は、たとえば「ＡＢＣ１２３」を「ABC123」にそろえます。空白処理や英字の小文字化もよく行います。ただし、「US」と「us」の違いなど、変換で失う情報があります。原文を残し、タスクに応じて決めましょう。</p>${flow(['ＡＩ を学ぶ','NFKC正規化<small>AI を学ぶ</small>','トークン分割','トークンID'])}`],
['何を1トークンにする？',`${table(['単位','特徴','注意点'],[['文字','未知語にも対応しやすい','列が長くなる'],['単語・形態素','人が解釈しやすい単位','辞書・境界の選択が必要'],['サブワード','頻出の文字列をまとめる','必ず単語の境界と一致するわけではない']])}<p>形態素解析は「私は猫が好き」を「私 / は / 猫 / が / 好き」のように分け、品詞などを付けます。サブワードのBPEは頻出する隣接ペアをまとめる手順を使います。SentencePieceはトークナイザを学習・利用するためのツール群で、BPEやUnigramなどを扱えます。</p>`],
['トークナイザはモデルとセット',`<p>同じ単語でも、トークナイザの語彙が違えばIDが変わります。事前学習モデルには対応するトークナイザを使います。長い文章の切り捨て（truncation）、長さをそろえるpadding、padding位置を区別するattention maskも確認します。</p>${note('「ない」などの否定語をストップワードとして削除すると、感情分類の意味を壊すことがあります。前処理は多ければよいわけではありません。')}`]
],lab:'tokenize',code:'import unicodedata\n\ntext = "ＡＩ  を学ぶ"\nnormalized = unicodedata.normalize("NFKC", text)\nnormalized = " ".join(normalized.split())\nprint(normalized)  # AI を学ぶ\n# 日本語の単語分割は形態素解析器などを使う。\n# str.split()だけでは空白のない日本語を分割できない。',exercise:['「ＡＩ」と「AI」を検索で同じものとして扱う利点を説明してください。','「おいしくない」から「ない」を削除すると、どんな問題がありますか？'],answer:'表記揺れによる検索漏れを減らせます。ただし原表記が必要な用途では原文も保持します。否定語の削除は評価の意味を逆転させるおそれがあります。',quiz:['事前学習済みモデルのトークナイザは？',['どれでも同じIDなので自由に交換する','そのモデルに対応するものを使う','単語をすべて同じIDにする'],1,'語彙IDと埋め込みの対応がモデルの学習時と一致する必要があります。'],sources:['hf']},
{title:'BoWとTF-IDF',subtitle:'テキストを数値ベクトルにする',time:50,tags:['BoW','IDF','疎な表現'],goal:'単語頻度と文書頻度を区別し、TF-IDFを手計算できる。',summary:'最初の文章表現は「どの単語が何回出たか」。語順を捨てる代わりに、軽量で解釈しやすいベクトルが手に入ります。',sections:[
['Bag of Wordsという割り切り',`<p>語彙を［猫, 犬, 好き］とすると「猫 猫 好き」は［2, 0, 1］。「猫が犬を追う」と「犬が猫を追う」は、助詞も含め同じ語の数なら同じ表現になり、役割の違いは失われます。語彙が大きいと成分の多くが0になるため、疎行列で保持します。</p>`],
['珍しい単語に重みを付ける',`<p>全ての文書に現れる語は、特定の文書を区別しにくい。TF-IDFは文書内の出現回数（TF）に、コーパス全体での珍しさ（IDF）を掛けます。dfは「その語を含む文書の数」であり、総出現回数ではありません。</p>${formula('idf(t) = ln((N + 1) / (df(t) + 1)) + 1<br>tfidf(t, d) = count(t, d) × idf(t)','この教材はscikit-learnの平滑化ありのIDFを使用。デモではL2正規化をしません。')}<p>3文書中1文書に出る語のIDFは約1.693、3文書全部に出る語は1。scikit-learnの標準設定では、この後、各文書ベクトルをL2正規化します。</p>`],
['学習データだけで語彙を作る',`<p>語彙やIDFは訓練データでfitし、検証・テストデータにはtransformだけを使います。テスト文書を含めてIDFを計算すると、評価用の情報が学習に入り込むデータ漏洩になります。日本語では分かち書き済みテキストや文字n-gramを使う選択肢があります。</p>`]
],lab:'tfidf',code:'from sklearn.feature_extraction.text import TfidfVectorizer\n\n# 教材用に空白で分割済み。実際の日本語には適切な分割を使う。\ndocs = ["猫 好き", "犬 好き", "猫 猫"]\nv = TfidfVectorizer(tokenizer=str.split, token_pattern=None,\n                    lowercase=False, norm=None)\nx = v.fit_transform(docs)\nprint(v.get_feature_names_out())\nprint(x.toarray())\n# 新しい文章には v.transform(["犬 猫"]) を使う。',exercise:['3文書［猫 好き］［犬 好き］［猫 猫］で「猫」のdfを求めてください。','語順が大切なタスクでBoWが困る例を1つ考えてください。'],answer:'「猫」を含むのは2文書なのでdf=2。総出現回数3とは違います。主語と目的語の入れ替え、否定の範囲などは語数だけでは区別しにくい例です。',quiz:['1文書で「猫」が10回出たとき、その文書のdfへの寄与は？',['10','1','0.1'],1,'文書頻度は出現回数ではなく、その語を含む文書の数です。'],sources:['tfidf']},
{title:'分類と評価',subtitle:'正解率以外の評価指標',time:60,tags:['分類','Precision / Recall','データ分割'],goal:'分類器の基本と、Accuracy・Precision・Recall・F1の使い分けを理解する。',summary:'分類モデルの作成はNLPのよい最初の実験です。大事なのは学習コードよりも、未知のデータで何ができたのかを測ることです。',sections:[
['線形分類器をベースラインに',`<p>二値ロジスティック回帰は、特徴xと重みwからスコアz = w・x + bを作り、sigmoid(z) = 1 / (1 + exp(−z))で陽性の確率を出します。通常はしきい値0.5などでラベルを決めます。しきい値を変えるとPrecisionとRecallのバランスも変わります。</p>${flow(['文書','TF-IDF','線形スコア','確率','ラベル'])}`],
['予測結果を4つに分ける',`${table(['','実際に陽性','実際に陰性'],[['陽性と予測','TP：見つけられた','FP：誤検出'],['陰性と予測','FN：見逃した','TN：正しく除外']])}${formula('Precision = TP / (TP + FP)<br>Recall = TP / (TP + FN)<br>F1 = 2PR / (P + R)','Precisionは「陽性と答えたものの正しさ」。Recallは「実際の陽性を拾えた割合」。')}<p>Accuracyは(TP+TN)/全件。多数派クラスが多いと、それだけで高くなることがあります。多クラスではクラス別スコアやmacro F1（各クラスのF1を単純平均）も確認します。</p>`],
['評価を汚さない分割',`<p>訓練用はパラメータの学習、検証用は設定の選択、テスト用は最後の評価に使います。同じ著者・同じ記事の複製が両側に入る場合は、グループ単位の分割を検討します。未来を予測する用途では時系列で分割します。</p>${note('同じテストセットで何度も設定を選ぶと、テストへの過適合が起きます。ベクトル化を含む処理はPipelineでまとめ、訓練側だけでfitします。')}`]
],lab:'metrics',code:'from sklearn.pipeline import make_pipeline\nfrom sklearn.feature_extraction.text import TfidfVectorizer\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics import classification_report\n\n# 小さすぎるデータなので、手順の確認用。性能を主張しない。\ntrain_x = ["映画 面白い", "作品 最高", "映画 退屈", "作品 最悪"]\ntrain_y = [1, 1, 0, 0]\ntest_x = ["映画 最高", "作品 退屈"]\ntest_y = [1, 0]\nmodel = make_pipeline(\n    TfidfVectorizer(tokenizer=str.split, token_pattern=None),\n    LogisticRegression(random_state=0))\nmodel.fit(train_x, train_y)\nprint(classification_report(test_y, model.predict(test_x),\n                            zero_division=0))',exercise:['迷惑メールの見逃しを減らしたい場合、どの指標を優先しますか？','TP=8、FP=2、FN=4のPrecisionとRecallを計算してください。'],answer:'迷惑メールを陽性と定義するとRecallを重視します。ただし正当なメールの誤除外（FP）の害も考えて調整します。Precision=0.8、Recall=8/12≈0.667、F1≈0.727。',quiz:['テストセットを使って何度も設定を選ぶと？',['評価がより公平になる','テストに合わせた選択で評価が楽観的になる','データが自動的に増える'],1,'設定選択は検証セットで行い、テストは最後の確認に使います。'],sources:['slp','tfidf']},
{title:'単語・文の埋め込み',subtitle:'単語・文のベクトルと類似度',time:50,tags:['分布仮説','embedding','コサイン類似度'],goal:'疎な表現と密な表現、静的埋め込みと文脈依存の表現を区別できる。',summary:'埋め込みは、単語や文を比較的少数の数値に写す表現です。似た文脈で現れる語が、近い表現を持つように学習する考え方から始めます。',sections:[
['周囲のことばから学ぶ',`<p>分布仮説は「似た文脈に現れる語は、意味や用法も似ていることが多い」という考え方です。word2vecのSkip-gramは中心語から周囲の語を予測し、学習の過程で単語ベクトルを得ます。語彙V個・次元dなら埋め込み表はV×dです。</p><p>one-hot表現（該当する語の位置だけを1、残りを0にする表現）では「猫」と「犬」の内積は0です。このような関係を直交と呼びます。それでも、学習した密な表現なら共通する文脈を反映できます。ただしベクトルの各成分が「動物らしさ」などの明確な意味を持つとは限りません。</p>`],
['方向の近さを測る',`${formula('cos(a, b) = (a・b) / (||a|| ||b||)','ゼロベクトルでは定義できません。値の範囲は−1〜1。')}<p>コサイン類似度は長さを除いて向きを比較します。意味の近さの便利な指標ですが、学習目的やデータによって、否定・数値・同名語などをうまく区別できない場合があります。</p>`],
['単語から文脈、そして文へ',`<p>静的埋め込みでは、bankはどの文でも同じベクトルです。Transformerなどは周囲の文脈で表現を変えます。文の埋め込みには、複数の単語ベクトルを1本にまとめるpooling（プーリング）も使えます。例えば各成分の平均を取ります。ただし、検索用途では類似度学習した文埋め込みモデルが適することがあります。</p>${note('2次元の散布図は説明用の投影です。高次元の距離をすべて保てるわけではなく、見た目だけでモデルの品質を判断しません。')}`]
],lab:'embedding',code:'import math\n\na, b = [1, 2], [2, 1]\ndot = sum(x*y for x, y in zip(a, b))\nnorm = lambda v: math.sqrt(sum(x*x for x in v))\nprint(dot / (norm(a)*norm(b)))  # 0.8',exercise:['[1,0]と[0,1]のコサイン類似度を求めてください。','「川のbank」と「金融のbank」を静的埋め込みで区別できない理由は？'],answer:'コサイン類似度は0。静的埋め込みは語彙の同じIDに同じベクトルを割り当て、文脈を入力にしないためです。',quiz:['文脈依存の埋め込みとは？',['同じ語でも周囲の文章で表現が変わる','語の文字数だけを返す','同じ単語なら、文脈によらず同じベクトルを使う'],0,'周囲の情報を混ぜて、各位置の表現を作ります。'],sources:['slp','hf']},
{title:'系列モデルと言語モデル',subtitle:'系列の扱いと次単語予測',time:55,tags:['n-gram','RNN','perplexity'],goal:'言語モデルの目的と、n-gram・RNNの違いを説明できる。',summary:'文章には順序があります。言語モデルは「それまでのことばを見て、次のトークンの確率を出す」モデルです。生成は、この予測を繰り返します。',sections:[
['文章の確率をつなぐ',`${formula('P(w₁, …, wₙ) = Πₜ P(wₜ | w₁, …, wₜ₋₁)','確率の連鎖律。実装では小さな値の積の代わりに対数の和を扱います。')}<p>bigramモデルは直前の1トークンだけを使います。例えば「猫」の後に「が」が3回、「は」が1回出たら、単純な最尤推定でP(が|猫)=0.75。未観測の組は確率0になるため、平滑化が必要です。長い文脈は捨てている点にも注意します。</p>`],
['RNNは履歴を状態に圧縮する',`${flow(['現在の入力 xₜ<br>前の状態 hₜ₋₁','それぞれ重み行列で変換','足し合わせて<br>バイアスを加える','活性化関数 tanh','新しい状態 hₜ'])}${formula('hₜ = tanh(Wₓ xₜ + Wₕ hₜ₋₁ + b)','列ベクトルで表記。Wₓ・Wₕは学習する重み、bはバイアスです。')}<p>入力と状態をそのまま足すのではなく、それぞれ変換してから足します。入力が3次元・状態が2次元なら、Wₓは2×3、Wₕは2×2です。tanh（双曲線正接）は各成分を−1から1の範囲に変換する活性化関数です。この更新をトークンごとに繰り返します。</p><p>RNNは現在の入力xと前の状態hから新しい状態を作ります。長い系列では、更新に使う勾配が極端に小さくなる「勾配消失」や、大きくなる「勾配爆発」が起こりやすくなります。そのため、遠く離れた語同士の関係（長期依存）を学びにくくなることがあります。LSTMやGRUは、情報をどの程度残すかを調整するゲートで長期依存の学習を助けますが、系列方向に順次計算する制約があります。</p>`],
['言語モデルの評価',`${formula('Perplexity = exp(平均の負の対数尤度)','自然対数を使用。正解トークンに高い確率を付けるほど低くなります。')}<p>同じ評価データ・トークナイザ・集計条件なら、Perplexityで予測性能を比較できます。異なるトークン分割での値を直接比べるのは適切ではありません。また、Perplexityが低いことだけで事実の正しさや回答の有用性は保証されません。</p>`]
],lab:'bigram',exercise:['「猫 が」「猫 が」「猫 は」のカウントからP(が|猫)を求めてください。','bigramが扱えない長い文脈の例を考えてください。'],answer:'平滑化なしなら2/3。例えば文章のかなり前に出た登場人物に合わせて代名詞を選ぶことなどは、直前の語だけでは難しいです。',quiz:['異なるトークナイザのPerplexityは？',['そのまま比較すれば必ず公平','評価単位が異なるため単純比較できない','どのモデルでも同じ値'],1,'分割が変わると予測する単位と系列長が変わります。'],sources:['slp']},
{title:'Attention',subtitle:'文脈ごとの重み付け',time:60,tags:['Query / Key / Value','softmax','加重平均'],goal:'Q・K・Vの役割と、Attentionの行列サイズ・計算結果を説明できる。',summary:'Attentionは「どの位置から、どれくらい情報を取り込むか」を決める計算です。各位置の情報を、関係の強さに応じた重みで混ぜ合わせます。',sections:[
['問い合わせ・見出し・内容',`<p>Query（Q）は探すための表現、Key（K）は照合される表現、Value（V）は混ぜる内容です。これらは通常、入力表現から別々の学習可能な線形変換で作ります。QとKの内積で対応スコアを作り、softmaxで重みにして、Vを加重平均します。</p>${flow(['QとK','内積スコア','softmax','重み × V','新しい表現'])}`],
['式の形を確認する',`${formula('Attention(Q, K, V) = softmax(QKᵀ / √dₖ) V','Q: n×dₖ、K: m×dₖ、V: m×dᵥ → 重み: n×m → 出力: n×dᵥ')}<p>softmaxは、各Queryの行ごとにKey方向へ適用します。√dₖで割るのは内積のスケールを調整するためです。Self-AttentionではQ・K・Vは同じ系列に由来します。Cross-AttentionではQuery側とKey・Value側の系列が異なります。</p>`],
['未来を見るか、見ないか',`<p>自己回帰型の次トークン予測では、未来の正解トークンを見せてはいけません。未来位置のスコアを−∞としてsoftmax前に隠すcausal maskを使います。padding maskは長さ調整用の位置を参照から外す別のものです。</p>${note('Attentionの重みが大きいことは、必ずしも人間向けの「理由」や因果的重要性を表しません。ここでのデモは架空のスコアによる計算の可視化です。')}`]
],lab:'attention',code:'import numpy as np\n\nq = np.array([[1., 0.]])\nk = np.array([[1., 0.], [0., 1.], [1., 1.]])\nv = np.array([[1., 0.], [0., 2.], [2., 2.]])\nscores = q @ k.T / np.sqrt(k.shape[1])\ne = np.exp(scores - scores.max(axis=-1, keepdims=True))\nweights = e / e.sum(axis=-1, keepdims=True)\nprint(weights)\nprint(weights @ v)  # 1個のQueryに対する2次元の出力',exercise:['n=4、dₖ=8のSelf-AttentionでQKᵀの形を答えてください。','重み[0.25,0.75]、Value[2,10]なら加重平均はいくつですか？'],answer:'QKᵀは4×4。加重平均は0.25×2+0.75×10=8。',quiz:['Attentionの重みを掛けて混ぜる対象は？',['Query','Value','トークンの文字数'],1,'QueryとKeyで重みを作り、その重みでValueを混ぜます。'],sources:['attention']},
{title:'Transformer',subtitle:'Attentionを積み重ねた構造',time:60,tags:['Multi-head','位置情報','Encoder / Decoder'],goal:'Transformerの主要な構成要素と、3つの利用形態を説明できる。',summary:'Attentionだけでは、順序を使った豊かな変換はできません。位置情報、複数のAttention、各位置のニューラルネットワークを積み重ねます。',sections:[
['1つのブロックを分解する',`${flow(['埋め込み＋位置情報','Multi-head Attention','残差＋正規化','FFN','残差＋正規化'])}<p>投影とは、ここでは重み行列を掛けてベクトルを別の表現に変えることです。Multi-head Attentionは複数の異なる重みでAttentionを計算し、結果をつなげて再び変換します。FFN（Feed-Forward Network、順伝播型ネットワーク）は、線形変換と活性化関数を組み合わせた処理です。同じFFNを各トークンの位置に適用します。残差接続は入力を出力に足し、特徴量の大きさを整える層正規化（Layer Normalization）とともに、深いネットワークの学習を助けます。この図は理解用の簡略化で、正規化の位置は方式により異なります。</p>`],
['順序を与える',`<p>位置情報のないSelf-Attentionは、入力の並べ替えに対して出力も同じように並び替わる性質があります。語順を区別するには位置の情報が必要です。元のTransformerは正弦・余弦の位置符号化を使います。学習可能な位置埋め込みや回転位置埋め込み（RoPE）などもあります。</p><p>通常のAttentionのスコア行列は長さnに対してn×n。長文では計算・メモリ負担が増えます。すべての派生モデルが同じ実装やコストを持つわけではありません。</p>`],
['Encoder、Decoder、両方',`${table(['形態','典型的な参照範囲','利用例'],[['Encoder-only','全入力位置を参照','BERT系：分類・抽出'],['Decoder-only','自分と過去の位置を参照','GPT系：次トークン生成'],['Encoder-decoder','入力を符号化し、出力側で参照','翻訳・要約']])}<p>学習時はcausal maskを使って複数位置の次トークン予測を並列に計算できます。一方、通常の自己回帰生成は、新しく決まったトークンを入力に足しながら順に進みます。</p>`]
],lab:'mask',exercise:['5トークンのcausal maskで、3番目の位置が参照できる位置を挙げてください。','位置情報が必要な理由を、「犬が猫を追う」を例に説明してください。'],answer:'1・2・3番目を参照できます。語の集合だけでなく並び方が役割を変えるので、位置情報で順序を伝えます。',quiz:['学習時に次トークン予測を並列に計算するには？',['未来の正解を自由に見せる','causal maskで未来を隠す','語順をすべて削除する'],1,'各位置の予測に未来の正解が漏れないようにします。'],sources:['attention','hf']},
{title:'事前学習とLLM',subtitle:'事前学習から指示追従まで',time:55,tags:['自己教師あり','SFT','生成'],goal:'事前学習・追加学習・推論を区別し、生成設定の役割を説明できる。',summary:'大規模言語モデル（LLM）は大量の文章から言語の規則性を学びます。チャットで指示に従う振る舞いは、事前学習だけで決まるわけではありません。',sections:[
['文章から正解を作る',`<p>自己回帰型の事前学習は、文章を1トークンずらして次トークンを正解にします。マスク言語モデルは、隠した部分を周囲から予測します。人が全ての文章にラベルを付けなくても、文章自体から訓練用の正解を作れるので自己教師あり学習と呼びます。</p>${flow(['大量の文章','事前学習','指示と応答でSFT','選好に基づく調整など','推論'])}<p>SFTは良い指示・応答の例で追加学習する方法です。人や別モデルによる選好を使う調整もあります。この流れは代表例であり、すべてのモデルが同じ工程を持つわけではありません。</p>`],
['生成は、分布から選ぶ繰り返し',`<p>greedyは最大確率のトークンを選びます。サンプリングは分布に従って抽選します。temperatureは分布の鋭さ、top-kは候補数、top-pは累積確率を使って候補を絞ります。選んだトークンを文脈に足して次を予測し、終了トークンや長さ制限で止めます。</p>${note('温度を0に近づけても、事実の正しさは保証されません。モデルはもっともらしい文章を生成できても、正しい根拠を持つとは限りません。')}`],
['プロンプトと追加学習の違い',`<p>プロンプトで例や制約を渡すのは推論時の条件付けで、通常はモデルの重みを更新しません。fine-tuningは訓練によって重みを変更します。専門知識の更新には検索を組み合わせる方法、出力形式や振る舞いの適応には追加学習など、目的に合わせて比較します。</p><p>評価は代表的な質問と正解基準を先に決めて行います。文章の流暢さ、指示への適合、事実性、コスト・速度は別々の軸です。</p>`]
],lab:'sampling',exercise:['「プロンプトに例を3つ入れる」と「モデルを追加学習する」の違いを説明してください。','数値を含む回答の事実性をどう検証するか考えてください。'],answer:'前者は入力の追加、後者は学習によるパラメータ更新です。数値の検証では信頼できる原資料と対象期間・単位を照合し、代表ケースを固定して評価します。',quiz:['プロンプトで例を与えると、通常は？',['重みを更新せず条件として使う','モデル全体を必ず再学習する','語彙をすべて作り直す'],0,'推論時の文脈として利用します。'],sources:['hf']},
{title:'検索とRAG',subtitle:'検索と生成の組み合わせ',time:60,tags:['検索','chunk','RAG評価'],goal:'検索と生成の役割を分け、RAGの失敗箇所を切り分けられる。',summary:'RAGは、質問に関係する情報を検索し、その情報を生成モデルへの入力に加える方法です。検索が正しくても、回答が正しいとは限りません。',sections:[
['検索と生成をつなぐ',`${flow(['文書 → chunk','検索用の索引','質問で検索','根拠＋質問','回答'])}<p>文書を小さなまとまり（chunk）に分け、単語ベースの検索やベクトル検索で候補を選びます。必要ならrerankerで候補の順序を再評価し、質問と根拠を生成モデルに渡します。生成には根拠の参照先を含める設計にすると、回答を検証しやすくなります。</p>`],
['chunkは小さすぎても大きすぎても困る',`<p>細かすぎる分割は前提や主語を失い、大きすぎる分割は無関係な内容を混ぜます。見出しや文の境界を利用し、文書名・更新日・場所などのメタデータを持たせます。文字数とトークン数は異なるので、生成モデルの入力上限も確認します。</p>`],
['2段階で評価する',`${table(['段階','確認すること','例'],[['検索','必要な根拠が候補に入ったか','Recall@k・順位'],['生成','根拠に支えられた回答か','正解性・回答と根拠の一致・引用の正確さ']])}<p>答えが間違っていたら、まず根拠が取得できていたかを見ます。取れていなければ検索や分割、取れていたのに間違えたなら回答生成や指示を検討します。答えが文書にない場合に「不明」と返せるかも評価します。</p>${note('RAGは誤情報を完全には防ぎません。古い文書、検索漏れ、引用の誤対応を別々に検証します。')}`]
],lab:'rag',exercise:['質問の正しい根拠がtop-5に入っているのに回答が誤る場合、どの段階を調べますか？','根拠が存在しない質問への望ましい動作を決めてください。'],answer:'生成段階を調べます。根拠の利用、文脈の競合、指示、引用の対応を確認します。根拠がなければ不明と伝える・確認先を示すなど、用途に応じた基準を先に決めます。',quiz:['RAGの検索評価と回答評価は？',['必ず同じ結果になる','別々に行うと失敗箇所を分けられる','どちらも不要'],1,'根拠を取れなかった失敗と、取れた根拠を使えなかった失敗は異なります。'],sources:['rag']},
{title:'実験と最終課題',subtitle:'実験設計と結果の説明',time:90,tags:['再現性','誤り分析','最終課題'],goal:'ベースライン・評価・誤り分析を含む小さなNLP実験を完成させる。',summary:'最後は、手を動かして結果を説明します。高い数値を出すことよりも、比較条件をそろえ、失敗の理由を次の改善につなげることを目標にします。',sections:[
['まずはレビュー分類を完成させる',`<p>公開範囲や利用条件を確認したレビューなどの文章とラベルを用意します。最初は少数を読み、ラベルの意味・曖昧さ・重複を確かめます。訓練・検証・テストを固定し、多数派ベースライン → TF-IDF＋ロジスティック回帰 → 余力があれば事前学習モデル、の順に比較します。</p>${flow(['タスク定義','データ確認','分割を固定','ベースライン','誤り分析'])}`],
['実験を再現できる形で残す',`${table(['記録項目','書く内容'],[['データ','出典、件数、クラス比、重複の扱い'],['分割','seed、時間・グループ条件、分割ID'],['環境','Python・ライブラリのバージョン'],['設定','前処理、特徴量、ハイパーパラメータ'],['結果','クラス別指標、混同行列、時間'],['失敗例','否定・皮肉・未知語などの分類と原文']])}<p>一度に変える条件を絞ります。改善案は「否定表現の誤りが多いので文字n-gramを試す」のように、観察と結び付けます。テストデータが少ないと、1件の予測結果でスコアが大きく変わるので、件数やばらつきも伝えます。</p>`],
['完成のチェックリスト',`<p>①入力・出力・評価が書ける。②分割前後の漏洩を確認した。③ベースラインと同じ条件で比較した。④少なくとも10件の誤りを読んだ（誤りが少なければ全件）。⑤限界と次の実験を説明できる。ここまでできれば、NLPの学習ループを1周できています。</p><p>次の発展先は、固有表現抽出（BIOラベル）、構文解析、機械翻訳、情報検索、音声処理、LLMの追加学習・評価などです。この12章は共通の土台であり、NLPの全分野を網羅する教材ではありません。</p>`]
],lab:'experiment',exercise:['自分のタスクの実験計画を、入力・出力・データ・分割・ベースライン・評価の6項目で書いてください。','誤りの仮説を1つ立て、その仮説だけを確かめる実験を考えてください。'],answer:'例：レビュー→肯定/否定、ラベル付きデータ、重複を除いた分割、多数派とTF-IDF分類器、macro F1と混同行列。否定に弱いという仮説なら、否定を含む固定の検証例で前処理の有無などを比較します。',quiz:['実験の改善に最も役立つのは？',['テストの答えを見て設定を毎回変更する','誤りを分類し、条件をそろえて仮説を検証する','スコアの低い例を評価から外す'],1,'観察した失敗から仮説を立て、公平な比較で確かめます。'],sources:['slp','hf']}
];

LESSONS[5].sections.unshift(['補講：ベクトルからニューラルネットワークへ', `
<p>ここからは、数値を「どのように変換するか」を学びます。第2章の内積を使って、行列・層・学習をつなげましょう。</p>
<h3>1. 行列を掛けると、複数の特徴を一度に計算できます</h3>
<p>縦に並べたベクトルxに行列Wを掛けると、Wの各行とxの内積が新しい成分になります。以下では、2個の数から別の2個の数を作っています。</p>
${formula('x = [2, 1]ᵀ　　W = [[1, −1], [0.5, 2]]<br>Wx = [1×2 − 1×1,　0.5×2 + 2×1]ᵀ = [1, 3]ᵀ', 'ᵀは転置の記号です。ここでは横に書いた数を縦の列ベクトルとして扱います。')}
<p>一般には、Wがm×d、xがd×1なら、出力はm×1です。内側の次元dが一致することを確認します。第8章のQKᵀも、この行列の掛け算です。</p>
<h3>2. 層は「重み付き変換＋活性化関数」で考えます</h3>
${flow(['入力 x','Wx + b<small>重みとバイアスで変換</small>','ReLU<small>活性化関数</small>','次の層へ'])}
<p>Wは各特徴の重み、b（バイアス）は出力に加える調整値です。ReLU（レルー）は各成分をmax(0, z)に変える関数で、例えば[−2, 3]は[0, 3]になります。このような非線形の変換を挟むことで、線形変換だけでは表せない関係を学べます。</p>
<p>こうした処理のまとまりを「層」と呼び、組み合わせたものがニューラルネットワークです。多くの層を使う学習を深層学習と呼びます。</p>
<h3>3. 重みは、予測の誤りから更新します</h3>
${flow(['入力から予測<small>順伝播</small>','正解と比較<small>損失を計算</small>','各重みへの影響を計算<small>誤差逆伝播</small>','重みを少し更新<small>勾配降下法など</small>'])}
<p>勾配は、重みを少し変えたときに損失がどう変わるかを表します。誤差逆伝播は、出力側から順にこの影響を計算する方法です。損失を下げる方向へ重みを更新する流れを、訓練データで繰り返します。</p>
<h3>4. この先に出てくる表現を確認しましょう</h3>

])}

iv>`).join('')}</div></section><section class="guide"><h3>2つの軸をつなぐ例：感情分析</h3><div class="approaches"><div><b>ルール</b>肯定語・否定語の辞書</div><div><b>統計・線形モデル</b>TF-IDF＋分類器</div><div><b>ニューラルモデル</b>文脈表現＋分類器</div></div><p>解く問題は同じです。必要なデータ、表現、計算量、誤りの傾向が変わります。新しい手法が、すべての用途で古い手法を置き換えるわけではありません。</p></section><section class="guide"><h3>この地図から、どう学ぶ？</h3><p><b>最初の一周：</b> 第1〜5章で、前処理・表現・分類・評価をつなげます。</p><p><b>文脈を理解する：</b> 第6〜9章で、埋め込み・系列・Attention・Transformerを学びます。</p><p><b>応用を作る：</b> 第10〜12章で、LLM・RAG・実験をつなげます。</p><p><b>二周目：</b> 地図で気になった品詞タグ付け、構文解析、Naive Bayes、HMMなどを掘り下げます。</p><a class="primary" href="#home">12章の学習マップへ →</a></section><div class="sources"><b>参考：分野ごとの詳細を調べる</b><a href="https://web.stanford.edu/~jurafsky/slp3/" target="_blank" rel="noopener">Speech and Language Processing · 系列ラベリング・構文解析・検索・音声など ↗</a><p>分類と短い説明は、この教材の学習用に独自に整理しています。</p></div></article>`;}
function initFields(){const topics=[...document.querySelectorAll('.topic')];$('#field-search').oninput=()=>{const q=$('#field-search').value.trim().toLowerCase();let count=0;document.querySelectorAll('.field-branch').forEach(branch=>{let visible=0;branch.querySelectorAll('.topic').forEach(t=>{const matches=t.dataset.search.includes(q)||branch.querySelector('h2').textContent.toLowerCase().includes(q);t.hidden=!matches;if(matches){visible++;count++;}});branch.hidden=visible===0;});$('#field-status').textContent=`${count} / ${topics.length}項目${q?' · 検索結果':' · 項目を開くと説明・例・関連章を表示'}`;$('.field-empty').hidden=count>0;};$('#expand-fields').onclick=()=>topics.filter(t=>!t.hidden).forEach(t=>t.open=true);$('#collapse-fields').onclick=()=>topics.forEach(t=>t.open=false);}

const EXAMPLE_FILES = {"reviews.csv": "id,text,label\np01,この映画は面白くて最後まで楽しめた,positive\np02,俳優の演技が素晴らしく感動した,positive\np03,物語の展開が面白い作品だった,positive\np04,音楽が美しく映像も素晴らしい,positive\np05,笑える場面が多く楽しい映画だった,positive\np06,丁寧な描写で登場人物に共感できた,positive\np07,結末に感動したのでまた見たい,positive\np08,期待以上に面白く友人にもすすめたい,positive\np09,演技が自然で物語に引き込まれた,positive\np10,テンポがよく最後まで飽きずに楽しめた,positive\np11,美しい映像と音楽が印象に残った,positive\np12,心が温かくなる素敵な作品だった,positive\np13,脚本がよくできていて満足した,positive\np14,予想外の展開が楽しく満足できた,positive\np15,家族と一緒に楽しめる良い映画だった,positive\np16,個性的な登場人物が魅力的だった,positive\np17,退屈かと思ったが実際は面白かった,positive\np18,派手さはないが丁寧で良い作品だった,positive\np19,もう一度見たいと思える素晴らしい作品,positive\np20,長い映画だが最後まで夢中で見た,positive\nn01,この映画は退屈で最後まで楽しめなかった,negative\nn02,俳優の演技が不自然でがっかりした,negative\nn03,物語の展開が単調でつまらない,negative\nn04,音楽がうるさく映像も見づらかった,negative\nn05,笑える場面が少なく退屈だった,negative\nn06,説明が足りず登場人物に共感できない,negative\nn07,結末が唐突で納得できなかった,negative\nn08,期待していたのにがっかりした,negative\nn09,演技が不自然で物語に入り込めなかった,negative\nn10,テンポが悪く途中で飽きてしまった,negative\nn11,映像は美しいが物語はつまらなかった,negative\nn12,話が暗いだけで印象に残らない作品,negative\nn13,脚本に矛盾が多く不満が残った,negative\nn14,展開が予想通りで驚きもなくつまらない,negative\nn15,家族と見たが誰も楽しめなかった,negative\nn16,登場人物に魅力を感じなかった,negative\nn17,面白そうだったが実際は退屈だった,negative\nn18,丁寧に見えるが内容が薄く不満だった,negative\nn19,もう一度見たいとは思えない作品だった,negative\nn20,長すぎる映画で時間を無駄に感じた,negative\n", "review_classification.py": "\"\"\"教材用の架空レビュー40件で、分類実験の流れを一周する。\"\"\"\nimport csv\nimport platform\nfrom pathlib import Path\n\nimport sklearn\nfrom sklearn.dummy import DummyClassifier\nfrom sklearn.feature_extraction.text import TfidfVectorizer\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics import classification_report, confusion_matrix, f1_score\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.pipeline import make_pipeline\n\n\ndef main():\n    with Path(__file__).with_name(\"reviews.csv\").open(encoding=\"utf-8\", newline=\"\") as f:\n        rows = list(csv.DictReader(f))\n    if len({r[\"text\"] for r in rows}) != len(rows):\n        raise ValueError(\"同じ文章が重複しています。分割前に確認してください。\")\n    if {r[\"label\"] for r in rows} != {\"negative\", \"positive\"}:\n        raise ValueError(\"labelはnegativeまたはpositiveにしてください。\")\n\n    # まずテスト20%を確保。残り80%のうち25%を検証用にする。\n    train_val, test = train_test_split(\n        rows, test_size=0.2, stratify=[r[\"label\"] for r in rows], random_state=42\n    )\n    train, valid = train_test_split(\n        train_val, test_size=0.25,\n        stratify=[r[\"label\"] for r in train_val], random_state=42\n    )\n    x_train, y_train = [r[\"text\"] for r in train], [r[\"label\"] for r in train]\n    x_valid, y_valid = [r[\"text\"] for r in valid], [r[\"label\"] for r in valid]\n    x_test, y_test = [r[\"text\"] for r in test], [r[\"label\"] for r in test]\n    print(f\"Python {platform.python_version()} / scikit-learn {sklearn.__version__}\")\n    print(f\"件数: train={len(train)}, valid={len(valid)}, test={len(test)}\")\n    for name, split in [(\"train\", train), (\"valid\", valid), (\"test\", test)]:\n        print(name, \"IDs:\", \", \".join(r[\"id\"] for r in split))\n\n    # 多数派を常に予測する基準。今回は同数なので同数時の選択に従う。\n    baseline = DummyClassifier(strategy=\"most_frequent\")\n    baseline.fit([[0]] * len(train), y_train)\n    print(\"多数派の検証macro F1:\", round(f1_score(\n        y_valid, baseline.predict([[0]] * len(valid)), average=\"macro\", zero_division=0\n    ), 3))\n\n    # 空白のない日本語を、文字2〜4-gramで数値化する。\n    # 語彙とIDFも訓練側だけで学習する。\n    best_score, best_c, best_model = -1, None, None\n    for c in [0.1, 1.0, 10.0]:\n        model = make_pipeline(\n            TfidfVectorizer(analyzer=\"char\", ngram_range=(2, 4)),\n            LogisticRegression(C=c, max_iter=1000, random_state=42)\n        )\n        model.fit(x_train, y_train)\n        score = f1_score(y_valid, model.predict(x_valid), average=\"macro\", zero_division=0)\n        print(f\"C={c}: 検証macro F1={score:.3f}\")\n        if score > best_score:\n            best_score, best_c, best_model = score, c, model\n\n    # 検証で選んだ学習済みモデルを、ここで一度だけテスト評価する。\n    pred = best_model.predict(x_test)\n    print(f\"\\n採用したC: {best_c}\")\n    print(\"多数派のテストmacro F1:\", round(f1_score(\n        y_test, baseline.predict([[0]] * len(test)), average=\"macro\", zero_division=0\n    ), 3))\n    print(classification_report(\n        y_test, pred, labels=[\"negative\", \"positive\"], digits=3, zero_division=0\n    ))\n    print(\"混同行列: 行=正解、列=予測。順序=negative, positive\")\n    print(confusion_matrix(y_test, pred, labels=[\"negative\", \"positive\"]))\n    print(\"\\nテストの誤り例:\")\n    errors = 0\n    for row, guess in zip(test, pred):\n        if guess != row[\"label\"]:\n            errors += 1\n            print(f'{row[\"id\"]}: 正解={row[\"label\"]}, 予測={guess}, 本文={row[\"text\"]}')\n    if errors == 0:\n        print(\"この分割では誤りなし。実データでの性能を保証する結果ではありません。\")\n    print(\"\\n架空の少量データによる手順確認です。スコアを一般化しないでください。\")\n\n\nif __name__ == \"__main__\":\n    main()\n"};

function lessonSearchText(l){
  const prose=[l.title,l.subtitle,l.goal,l.summary,...l.tags,...l.sections.flat(),...l.exercise,l.answer,...l.quiz.flat()];
  return (prose.join(' ').replace(/<[^>]*>/g,' ')+' '+(l.code||'')).normalize('NFKC').toLowerCase();
}
function bindDownloads(){
  document.querySelectorAll('[data-download]').forEach(button=>button.onclick=()=>{
    const name=button.dataset.download;
    if(!Object.prototype.hasOwnProperty.call(EXAMPLE_FILES,name))return;
    const url=URL.createObjectURL(new Blob([EXAMPLE_FILES[name]],{type:'text/plain;charset=utf-8'}));
    const link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();

function softmax(xs,t=1){const m=Math.max(...xs);const es=xs.map(x=>Math.exp((x-m)/t));const total=es.reduce((a,b)=>a+b,0);return es.map(x=>x/total);}
function bars(labels,values,scale=1){return `<div class="bars">${labels.map((l,i)=>`<div class="barrow"><span>${esc(l)}</span><div class="bartrack"><div class="barfill" style="width:${Math.max(0,Math.min(100,values[i]/scale*100))}%"></div></div><span>${values[i].toFixed(3)}</span></div>`).join('')}</div>`;}
function nav(){const query=$('#search').value.normalize('NFKC').trim().toLowerCase();const active=location.hash;$('#nav').innerHTML=`<a class="navitem ${active==='#home'||!active?'active':''}" href="#home"><span class="num">⌂</span>学習マップ</a><a class="navitem ${active==='#fields'?'active':''}" href="#fields"><span class="num">◇</span>NLPの分野マップ</a>`+LESSONS.map((l,i)=>({l,i})).filter(({l})=>lessonSearchText(l).includes(query)).map(({l,i})=>`<a class="navitem ${active===`#chapter-${i+1}`?'active':''} ${state.done.includes(i)?'done':''}" href="#chapter-${i+1}" ${active===`#chapter-${i+1}`?'aria-current="page"':''}><span class="num">${state.done.includes(i)?'✓':String(i+1).padStart(2,'0')}</span>${l.title}</a>`).join('');if(query&&$('#nav').children.length===2)$('#nav').insertAdjacentHTML('beforeend','<p class="empty">該当する章がありません。</p>');$('#count').textContent=`${state.done.length} / 12`;$('#progress').value=state.done.length;}
function home(){return `<div class="home"><div class="hero"><div><p class="eyebrow">Python経験者向け</p><h1>自然言語処理入門</h1><p class="lead">テキストの数値化から、分類・Transformer・RAGまでを、<br>図解と小さな実験で順に学びます。</p><a class="primary" href="#chapter-1">第1章から始める <span aria-hidden="true">↗</span></a></div><div class="hero-visual" aria-label="文章からトークン、ベクトル、予測への変換の図"><div class="visual-label">FROM WORDS TO NUMBERS</div><div class="sentence">「猫が好き」</div><div class="tokenrow"><span class="token">猫</span><span class="token">が</span><span class="token">好き</span></div><div class="arrow">↓</div><div class="vectorrow">${[0,1,2].map((v)=>`<div class="vector">${[18,28,11,34,22,15].map((h,i)=>`<i style="height:${(h+v*7+i*3)%30+8}px"></i>`).join('')}</div>`).join('')}</div><div class="arrow">↓</div><div class="output">数値表現を使って、分類・検索・生成を行う</div><small style="display:block;text-align:center;color:var(--muted);font-size:10px;margin-top:12px">概念図 · ベクトルは説明用です</small></div></div><div class="facts"><div><b>12</b><span>基礎から応用までの章</span></div><div><b>12</b><span>ブラウザで動かす実験</span></div><div><b>Python</b><span>基本文法の経験が前提</span></div></div><a class="field-teaser" href="#fields"><span>まずは全体像から</span><b>NLPには、どんな分野がある？</b><small>手法の4段階と応用 × 解く問題の地図 →</small></a><div class="sectionhead"><h2>学習マップ</h2><small>全12章を4つの段階に分けています。</small></div>${[['01','基礎','ことばと数値',0,3],['02','分類と評価','表現と評価',3,6],['03','系列モデル','系列とAttention',6,9],['04','応用','LLMと実験',9,12]].map(([n,t,s,start,end])=>`<section class="phase"><div class="phase-label">PHASE ${n}<b>${t}</b>${s}</div><div class="cards">${LESSONS.slice(start,end).map((l,j)=>`<a class="chaptercard" href="#chapter-${start+j+1}"><span class="index">${String(start+j+1).padStart(2,'0')} ${state.done.includes(start+j)?'✓':''}</span><h3>${l.title}</h3><p>${l.subtitle}</p><small>学習時間の目安 ${l.time}分 <span aria-hidden="true">↗</span></small></a>`).join('')}</div></section>`).join('')}<div class="guide"><h3>学習の進め方（3ステップ）</h3><p><b>1. 図から入る。</b> 入力・出力・数式の形を確認する。</p><p><b>2. 変えてみる。</b> 実験の数値を動かし、結果を予想してから見る。</p><p><b>3. 説明して残す。</b> 理解チェックと演習に答え、メモに自分の説明を書く。</p><p>各章の時間は初めて学ぶ場合の学習時間の目安です。Pythonの実行は別の環境で行います。最終課題には追加の実装時間を取りましょう。</p></div><div class="sectionhead"><h2>4週間の進め方</h2><small>週3回＋復習。ペースは自由です。</small></div><div class="schedule">${['1〜3章：全体像・数学・前処理','4〜6章：TF-IDF・評価・埋め込み','7〜9章：系列・Attention・Transformer','10〜12章：LLM・RAG・最終課題'].map((x,i)=>`<div><b>Week ${i+1}</b>${x}<br>章を読む → 演習 → 復習</div>`).join('')}</div><div class="sectionhead"><h2>深く学ぶための参考資料</h2></div><div class="sources"><p>教材は独自の入門解説です。詳細や実装仕様は各章の参考資料で確認できます。</p>${['slp','hf','attention','tfidf'].map(k=>`<a href="${SOURCES[k][1]}" target="_blank" rel="noopener">${SOURCES[k][0]} ↗</a>`).join('')}</div></div>`;}
function lesson(i,print=false){const l=LESSONS[i];return `<article class="lesson" data-chapter="${i}"><div class="lesson-nav"><a href="#home">学習マップ</a> / 第${i+1}章</div><p class="eyebrow">CHAPTER ${String(i+1).padStart(2,'0')} / 12 · 学習時間の目安 ${l.time}分</p><h1>${l.title}</h1><p class="summary">${l.summary}</p><div class="tags">${l.tags.map(t=>`<span>${t}</span>`).join('')}</div><div class="objectives"><b>この章のゴール</b><p>${l.goal}</p></div>${l.sections.map(([t,b],j)=>`<section><h2><span style="color:var(--green);font:14px ui-monospace;margin-right:10px">0${j+1}</span>${t}</h2>${b}</section>`).join('')}<div class="lab" id="lab-${i}"><span class="lab-heading">TRY IT YOURSELF</span>${labMarkup(l.lab)}</div>${l.code?`<div class="code-top"><span>Pythonで確かめる · 自分の環境で実行</span><button class="copy" data-i="${i}">コードをコピー</button></div><pre><code>${esc(l.code)}</code></pre>`:''}<div class="quiz"><h3>理解チェック</h3><p>${l.quiz[0]}</p>${l.quiz[1].map((x,j)=>`<button class="answer" data-i="${i}" data-answer="${j}">${String.fromCharCode(65+j)}. ${x}</button>`).join('')}<div class="feedback" role="status" aria-live="polite"></div><div class="print-only">正解：${l.quiz[1][l.quiz[2]]}。${l.quiz[3]}</div></div><section class="exercise"><h3>自分の手で考える</h3><ol>${l.exercise.map(x=>`<li>${x}</li>`).join('')}</ol><details ${print?'open':''}><summary>解答の例を見る</summary><p>${l.answer}</p></details></section>${print?'':`<div class="memo"><label for="memo">学習メモ</label><textarea id="memo" placeholder="今日理解したこと、まだ疑問なこと、自分の言葉での説明…">${esc(state.notes[i]||'')}</textarea><small id="memo-status" aria-live="polite">このブラウザ内だけに保存します。別端末には同期されません。</small></div><div class="lesson-bottom"><a href="${i?`#chapter-${i}`:'#home'}">← ${i?'前の章':'学習マップ'}</a><button class="primary" id="complete">${state.done.includes(i)?'✓ 完了済み（取り消す）':'この章を完了にする'}</button><a href="${i<11?`#chapter-${i+2}`:'#home'}">${i<11?'次の章':'学習マップ'} →</a></div>`}<div class="sources"><b>参考資料</b>${l.sources.map(k=>`<a href="${SOURCES[k][1]}" target="_blank" rel="noopener">${SOURCES[k][0]} ↗</a>`).join('')}</div></article>`;}
function labMarkup(kind){switch(kind){
case 'task':return '<h3>タスクを選び、入力と出力を確認</h3><label for="task">目的</label><select id="task"><option value="0">感情分類</option><option value="1">固有表現抽出</option><option value="2">文書検索</option><option value="3">翻訳</option></select><div class="labresult" id="result" aria-live="polite"></div>';
case 'softmax':case 'sampling':return `<h3>${kind==='sampling'?'温度を変えて、次トークンの分布を見る':'同じスコアでも、温度で確率は変わる'}</h3><p>候補「猫・犬・鳥」の架空のlogitは [2, 1, 0]。</p><label for="temperature">温度 T：<output id="temp-value">1.00</output></label><input id="temperature" type="range" min="0.1" max="3" step="0.05" value="1"><div class="labresult" id="result" aria-live="polite"></div>${kind==='sampling'?'<button id="sample">分布から1つ抽選する</button><span id="sampled" role="status"></span>':''}`;
case 'tokenize':return '<h3>同じ文章を、異なる単位で分割</h3><label for="text">文章（最大200文字）</label><input id="text" maxlength="200" value="ＡＩ について学ぶ"><label for="unit">分割単位</label><select id="unit"><option value="char">文字単位</option><option value="space">空白単位</option></select><p>これは分割の基本を観察する実験です。日本語の形態素解析・BPEは実行していません。</p><div class="labresult" id="result" aria-live="polite"></div>';
case 'tfidf':return '<h3>コーパスを変えて、IDFを確かめる</h3><label for="docs">1行1文書・語は空白区切り（最大2,000文字）</label><textarea id="docs" rows="3" maxlength="2000">猫 好き\n犬 好き\n猫 猫</textarea><p>TFは出現回数、IDFは平滑化あり、L2正規化なし。先頭20語を表示します。</p><div class="labresult" id="result" aria-live="polite"></div>';
case 'metrics':return '<h3>誤検出と見逃しで、何が変わる？</h3><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">'+['TP','FP','FN','TN'].map((x,i)=>`<label>${x}<input class="cm" type="number" min="0" max="10000" step="1" value="${[8,2,4,86][i]}" aria-label="${x}"></label>`).join('')+'</div><div class="labresult" id="result" aria-live="polite"></div>';
case 'embedding':return '<h3>2本のベクトルの、角度を変える</h3><p>赤は [1,0]、緑は [cosθ,sinθ]。意味を学習したベクトルではなく、方向を理解する幾何学デモです。</p><label for="angle">角度 θ：<output id="angle-value">45°</output></label><input id="angle" type="range" min="0" max="180" value="45"><div class="labresult" id="result" aria-live="polite"></div>';
case 'bigram':return '<h3>直前の1語で予測する</h3><p>架空の学習カウントに基づく、平滑化なしのbigramです。文頭・文末は省略しています。</p><label for="previous">直前の語</label><select id="previous"><option>猫</option><option>が</option><option>好き</option></select><div class="labresult" id="result" aria-live="polite"></div>';
case 'attention':return '<h3>重みが変わると、混ぜる内容も変わる</h3><p>1つのQueryに対する、スケーリング後の架空スコアを変更。各Valueは [1,0]・[0,2]・[2,2]。</p>'+['私','猫','好き'].map((t,i)=>`<label for="score-${i}">${t} のスコア：<output id="score-value-${i}">${[1,2,0][i]}</output></label><input class="score" id="score-${i}" type="range" min="-3" max="3" step="0.1" value="${[1,2,0][i]}">`).join('')+'<div class="labresult" id="result" aria-live="polite"></div>';
case 'mask':return '<h3>どの位置が、どの位置を参照できる？</h3><label for="mask">マスク</label><select id="mask"><option value="causal">causal：過去と自分だけ</option><option value="full">全位置：双方向</option></select><p>行はQuery、列はKey。●は参照できる位置、—は参照できない位置です。</p><div class="labresult" id="result"></div>';
case 'rag':return '<h3>検索された根拠を確認する</h3><p>3件の架空の講座案内を対象にした文字2-gramのJaccard類似度検索。LLMによる回答生成は行いません。</p><label for="query">質問</label><input id="query" maxlength="200" value="講座の開催日は？"><div class="labresult" id="result" aria-live="polite"></div>';
case 'experiment':return '<h3>実験計画を組み立てる</h3><p>この欄は下の学習メモとは別です。計画をコピーして手元に保存できます。</p>'+[['purpose','入力 → 出力','レビュー → 肯定 / 否定'],['baseline','ベースライン','多数派予測、TF-IDF＋ロジスティック回帰'],['evaluation','評価・分割','macro F1、重複を除いた固定分割']].map(([id,t,v])=>`<label for="${id}">${t}</label><input id="${id}" maxlength="500" value="${v}">`).join('')+'<div class="labresult" id="result"></div><button id="copy-plan">計画をコピー</button><span id="plan-status" role="status"></span>';
}}
function initLab(kind, root=document, interactive=true){const $=s=>root.querySelector(s);const result=$('#result');const update=()=>{switch(kind){
case 'task':{const k=Number($('#task').value);result.innerHTML=[['レビュー：「とても面白かった」','出力：肯定','評価：F1・混同行列'],['文章：「田中さんは東京で働く」','出力：田中→人名、東京→地名','評価：範囲とラベルの一致'],['質問：「NLPの教材は？」','出力：関連文書を順位付きで返す','評価：Recall@k・MRR'],['原文：「猫が好きです」','出力：I like cats.','評価：自動指標と人による評価']][k].map(x=>`<div>${x}</div>`).join('');break;}
case 'softmax':case 'sampling':{const t=Number($('#temperature').value);$('#temp-value').value=t.toFixed(2);const ps=softmax([2,1,0],t);result.innerHTML=bars(['猫','犬','鳥'],ps)+`<p>合計：${ps.reduce((a,b)=>a+b,0).toFixed(3)}${kind==='softmax'?` / 正解が猫なら損失：${(-Math.log(ps[0])).toFixed(3)}`:''}</p>`;break;}
case 'tokenize':{const s=$('#text').value;const normalized=s.normalize('NFKC').replace(/\s+/g,' ').trim();const tokens=$('#unit').value==='char'?Array.from(normalized).filter(x=>!(/\s/.test(x))):normalized.split(/\s+/).filter(Boolean);result.innerHTML=`<p>正規化後：${esc(normalized)||'（空）'}</p><div class="tokenrow" style="justify-content:flex-start">${tokens.map(t=>`<span class="token">${esc(t)}</span>`).join('')}</div><p>${tokens.length} トークン${$('#unit').value==='char'?'（空白は除外）':''}</p>`;break;}
case 'tfidf':{const docs=$('#docs').value.split('\n').map(d=>d.trim().split(/\s+/).filter(Boolean)).filter(d=>d.length);if(!docs.length){result.textContent='文書を入力してください。';break;}const vocab=[...new Set(docs.flat())].slice(0,20);result.innerHTML=table(['語','df','IDF',...docs.map((_,i)=>`文書${i+1} TF-IDF`)],vocab.map(t=>{const df=docs.filter(d=>d.includes(t)).length;const idf=Math.log((docs.length+1)/(df+1))+1;return [esc(t),df,idf.toFixed(3),...docs.map(d=>(d.filter(x=>x===t).length*idf).toFixed(3))];}));break;}
case 'metrics':{const ns=[...root.querySelectorAll('.cm')].map(x=>Math.max(0,Math.min(10000,Math.floor(Number(x.value)||0))));const [tp,fp,fn,tn]=ns;const ratio=(a,b)=>b?a/b:null;const p=ratio(tp,tp+fp),r=ratio(tp,tp+fn),f=ratio(2*tp,2*tp+fp+fn),acc=ratio(tp+tn,tp+fp+fn+tn);result.innerHTML='<div class="metrics">'+[[p,'Precision'],[r,'Recall'],[f,'F1'],[acc,'Accuracy']].map(([v,t])=>`<div class="metric">${v===null?'未定義':v.toFixed(3)}<small>${t}</small></div>`).join('')+'</div><p>分母0は「未定義」と表示。入力は0〜10,000の整数として扱います。</p>';break;}
case 'embedding':{const a=Number($('#angle').value),x=Math.cos(a*Math.PI/180),y=Math.sin(a*Math.PI/180);$('#angle-value').value=`${a}°`;result.innerHTML=`<svg viewBox="0 0 360 200" width="360" role="img" aria-label="角度${a}度の単位ベクトル"><line x1="25" y1="170" x2="335" y2="170" stroke="#b4c3aa"/><line x1="180" y1="190" x2="180" y2="15" stroke="#b4c3aa"/><path d="M 60 170 A 120 120 0 0 1 300 170" fill="none" stroke="#d8e0d0" stroke-dasharray="4 4"/><line x1="180" y1="170" x2="300" y2="170" stroke="#c57544" stroke-width="4"/><line x1="180" y1="170" x2="${180+120*x}" y2="${170-120*y}" stroke="#196b54" stroke-width="4"/><circle cx="${180+120*x}" cy="${170-120*y}" r="5" fill="#196b54"/></svg><p>緑のベクトル：[${x.toFixed(3)}, ${y.toFixed(3)}] / コサイン類似度：<b>${x.toFixed(3)}</b></p>`;break;}
case 'bigram':{const k=$('#previous').value;const data={'猫':[['が','は'],[3,1]],'が':[['好き','走る'],[2,2]],'好き':[['です','だ'],[4,1]]};const [ls,cs]=data[k];result.innerHTML=`<p>「${k}」の後のカウント：${ls.map((l,i)=>`${l}=${cs[i]}`).join('、')}</p>`+bars(ls,cs.map(c=>c/cs.reduce((a,b)=>a+b,0)));break;}
case 'attention':{const scores=[...root.querySelectorAll('.score')].map((x,i)=>{const v=Number(x.value);$(`#score-value-${i}`).value=v.toFixed(1);return v;});const w=softmax(scores),v=[[1,0],[0,2],[2,2]],out=[0,1].map(j=>w.reduce((s,a,i)=>s+a*v[i][j],0));result.innerHTML=bars(['私','猫','好き'],w)+`<p>重みの合計：1.000 / 出力 = [${out.map(x=>x.toFixed(3)).join(', ')}]</p>`;break;}
case 'mask':{const full=$('#mask').value==='full';result.innerHTML=table(['Query ↓ / Key →','1','2','3','4','5'],Array.from({length:5},(_,i)=>[i+1,...Array.from({length:5},(_,j)=>full||j<=i?'●':'—')]));break;}
case 'rag':{const docs=['講座の開催日は11月1日です。','講座の参加費は無料です。','講座の場所はオンラインです。'];const grams=s=>{const a=Array.from(s.replace(/[\s？?。、]/g,''));return new Set(a.slice(0,-1).map((c,i)=>c+a[i+1]));};const q=grams($('#query').value);const ranked=docs.map((d,i)=>{const g=grams(d);const intersection=[...q].filter(t=>g.has(t)).length;const union=new Set([...q,...g]).size;return {d,i,score:union?intersection/union:0};}).sort((a,b)=>b.score-a.score);result.innerHTML=ranked.map((r,i)=>`<p><b>${i+1}位 · 文書${r.i+1}</b> / 類似度 ${r.score.toFixed(3)}<br>${esc(r.d)}</p>`).join('')+'<p>スコアは回答の確かさではありません。関係がない質問でも候補が並ぶので、根拠の有無を確認します。</p>';break;}
case 'experiment':{result.textContent=`入力・出力：${$('#purpose').value}\nベースライン：${$('#baseline').value}\n評価・分割：${$('#evaluation').value}`;result.style.whiteSpace='pre-wrap';break;}
}};update();if(!interactive)return;root.querySelectorAll('.lab input,.lab select,.lab textarea').forEach(el=>el.addEventListener('input',update));if(kind==='sampling')$('#sample').onclick=()=>{const ps=softmax([2,1,0],Number($('#temperature').value)),r=Math.random();let sum=0,index=2;for(let j=0;j<ps.length;j++){sum+=ps[j];if(r<sum){index=j;break;}}$('#sampled').textContent=` → 抽選結果：${['猫','犬','鳥'][index]}`;};if(kind==='experiment')$('#copy-plan').onclick=()=>copyText(result.textContent,$('#plan-status'));}
async function copyText(text,target){try{await navigator.clipboard.writeText(text);target.textContent='コピーしました';}catch{target.textContent='コピーできません。表示された本文を選択してコピーしてください。';}}
function render(focus=false){nav();const match=location.hash.match(/^#chapter-(\d+)$/);const i=match?Number(match[1])-1:-1;if(location.hash==='#fields'){$('#main').innerHTML=fieldsPage();document.title='NLPの分野マップ｜NLP Learning Lab';initFields();}else if(i<0||i>=LESSONS.length){$('#main').innerHTML=home();document.title='自然言語処理入門｜NLP Learning Lab';}else{const l=LESSONS[i];$('#main').innerHTML=lesson(i);document.title=`第${i+1}章 ${l.title}｜NLP Learning Lab`;initLab(l.lab);$('#complete').onclick=()=>{state.done=state.done.includes(i)?state.done.filter(v=>v!==i):[...state.done,i];const stored=save();nav();$('#complete').textContent=state.done.includes(i)?'✓ 完了済み（取り消す）':'この章を完了にする';if(!stored)$('#memo-status').textContent='ブラウザ保存が使えないため、再読込すると進捗が消えます。';};$('#memo').oninput=()=>{state.notes[i]=$('#memo').value;$('#memo-status').textContent=save()?'メモをこのブラウザに保存しました。':'保存できません。メモをコピーして手元に残してください。';};document.querySelectorAll('.answer').forEach(btn=>btn.onclick=()=>{const selected=Number(btn.dataset.answer),correct=selected===l.quiz[2];btn.closest('.quiz').querySelectorAll('button').forEach(b=>b.classList.remove('correct','wrong'));btn.classList.add(correct?'correct':'wrong');$('.feedback').textContent=(correct?'正解です。':'もう一度考えてみましょう。')+' '+l.quiz[3];});if(l.code)$('.copy').onclick=()=>copyText(l.code,$('.copy'));bindDownloads();}if(focus){window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true});}}
$('#search').oninput=nav;
$('.skip').onclick=e=>{e.preventDefault();$('#main').focus();};
window.addEventListener('hashchange',()=>render(true));
$('#print').onclick=()=>{preparePrintDocument();window.print();};
window.addEventListener('afterprint',cleanPrintDocument);
render();
</script></body></html>
